name: US OSHA Watch
# 미국 OSHA(노동부 API) 점검·위반·사고 — 출입처 미국 법인·공장. 매일 06:40 KST(Cloudflare 요청, GitHub 예약은 대비용).
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만(사업장 이름·주소·서술은 찍지 않는다).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/us_osha_watch.py'
      - 'tests/test_us_osha_watch.py'
      - '.github/workflows/us-osha.yml'
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: us-osha-watch
  cancel-in-progress: false
jobs:
  osha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test OSHA parsing
        run: python -m unittest tests.test_us_osha_watch tests.test_private_store -v
      - name: Watch OSHA inspections (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
        run: python scripts/us_osha_watch.py
