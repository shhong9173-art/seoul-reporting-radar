name: Customs Live Smoke (Temporary)
on:
  push:
    branches:
      - integration/customs-month-format-20261013
    paths:
      - .github/workflows/customs-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Validate official API with configured secret without publishing
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          test -n "$CUSTOMS_API_KEY" || { echo "CUSTOMS_API_KEY secret missing"; exit 1; }
          python scripts/customs.py --hs 8504 --start 202601 --end 202601 --country US
          echo "Official HS month API returned validated data"
