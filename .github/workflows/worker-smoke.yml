name: Worker 배포 뒤 운영 점검
# 11-13: 처리 장부가 Worker CPU 한도를 넘겨 운영 도구가 31분간 끊겼다(오류 1102). 오프라인 테스트로는 안 보인다.
# main에 Worker 코드가 들어가면 배포를 기다렸다가, 그리고 3시간마다, 기자 전용 도구를 실제로 불러 본다.
# 11-14: GitHub 예약은 병합 뒤 8시간 동안 한 번도 돌지 않았다 — Cloudflare 정시 요청(dispatch.mjs, 하루 일곱 번)이 주된 길이고 아래 예약은 대비용이다.
# 로그에는 도구 이름·시간·글자 수·오류 번호만 남는다(도구가 돌려준 글은 찍지 않는다).
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'wrangler.json', 'scripts/worker_smoke.py', 'tests/test_worker_smoke.py', '.github/workflows/worker-smoke.yml']
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: worker-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - run: python -m unittest tests/test_worker_smoke.py
      - env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/worker_smoke.py
