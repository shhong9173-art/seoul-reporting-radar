name: Public-Only Press Office Questions
on:
  pull_request:
    paths:
      - 'scripts/public_reporting_questions.py'
      - 'tests/test_public_reporting_questions.py'
      - 'scoop_scout.py'
      - '.github/workflows/public-only-reporting-questions.yml'
      - '.github/workflows/scoop-radar.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/public_reporting_questions.py'
      - 'scoop_scout.py'
      - '.github/workflows/public-only-reporting-questions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts/public_reporting_questions.py scoop_scout.py
      - run: python -m unittest discover -s tests -p 'test_public_reporting_questions.py' -v
