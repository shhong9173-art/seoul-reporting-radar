name: Verify Published GitHub Pages (Temporary)
on:
  push:
    branches:
      - diagnostics/pages-live-verify-20261013
    paths:
      - .github/workflows/pages-live-verify-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual public Pages HTML and all 3 live statistical JSONs
        run: |
          python -u - <<'PY'
          import hashlib,json,sys,time,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          base="https://shhong9173-art.github.io/seoul-reporting-radar/"
          paths=["data-lab.html","digests/hs_trends_latest.json",
                 "digests/customs_tenday_latest.json","digests/customs_five_latest.json"]
          def grab(path):
              url=base+path+"?pages_live_verify=20261013"
              req=urllib.request.Request(url,headers={
                  "User-Agent":"CustomsPagesLiveVerification/1.0",
                  "Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=16) as r:
                  return r.status, r.url, r.headers.get("Content-Type",""),r.read()
          for path in paths:
              status=None
              for i in range(3):
                  try:
                      status,url,ctype,body=grab(path)
                      sha=hashlib.sha256(body).hexdigest()
                      local=Path(path).read_bytes()
                      same=(body==local)
                      print("LIVE",path,"status",status,"contentType",ctype.split(";")[0],
                            "bytes",len(body),"sha256",sha[:16],
                            "matches_main",same,flush=True)
                      if path.endswith(".json"):
                          d=json.loads(body)
                          if path.endswith("customs_five_latest.json"):
                              assert sorted(s["id"] for s in d["services"])==sorted([
                                  "regional","newtemper_country","newtemper",
                                  "temper_country","kind"])
                              assert all(s["rawRecordsCurrent"]>0 and s["rawRecordsPriorYear"]>0
                                         for s in d["services"])
                              print("DATA",path,"generatedAt",d["generatedAt"],
                                    "period",d["period"],"services",len(d["services"]),flush=True)
                          if path.endswith("customs_tenday_latest.json"):
                              assert len(d["observed"])>0 and len(d["focus"])>0
                              print("DATA",path,"generatedAt",d["generatedAt"],
                                    "periods",sorted({r["month"] for r in d["focus"]}),flush=True)
                          if path.endswith("hs_trends_latest.json"):
                              assert len(d["items"])==4
                              print("DATA",path,"generatedAt",d["generatedAt"],flush=True)
                      else:
                          text=body.decode("utf-8")
                          for marker in ["id=\"customs-five-data\"",
                                         "digests/customs_five_latest.json",
                                         "digests/customs_tenday_latest.json",
                                         "digests/hs_trends_latest.json"]:
                              assert marker in text, "Missing live HTML marker "+marker
                          print("HTML_PANELS",path,"customs_five,tenday,HS4",flush=True)
                      if same:
                          break
                      if i!=2:
                          print("Pages deployment not at current main yet; retry",i+1,flush=True)
                          time.sleep(10)
                  except Exception as e:
                      print("LIVE_ERROR",path,type(e).__name__,str(e)[:190],flush=True)
                      if i==2:
                          raise
                      time.sleep(10)
              if status!=200 or not same:
                  raise SystemExit("LIVE_MISMATCH_OR_HTTP_ERROR: "+path)
          print("PAGES_ALL_FILES_LIVE_AND_MATCH_MAIN",len(paths),flush=True)
          PY
