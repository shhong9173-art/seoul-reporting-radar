name: Latest Interim Business Source Scout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/latest-interim-scout.yml'
      - 'scripts/recent_business_scout.py'
      - 'scripts/business_content.py'
      - 'dart_corp_codes.json'
  schedule:
    # Mon-Fri 07:45 Asia/Seoul = Sunday-Thursday 22:45 UTC
    - cron: '45 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-interim-business-evidence
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate latest-period and same-period evidence restrictions
        run: |
          python -m compileall -q scripts/recent_business_scout.py
          python -m unittest discover -s tests -p 'test_recent_business_scout.py' -v
      - name: Scan latest periodic filings and check prior related reporting
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/recent_business_scout.py
      - name: Publish dated official source leads only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/recent_business_latest.json
          if git diff --cached --quiet; then
            echo "No new official source scan"
          else
            git commit -m "data: refresh recent interim business evidence [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            echo "Could not safely publish latest DART source evidence" >&2
            exit 1
          fi
