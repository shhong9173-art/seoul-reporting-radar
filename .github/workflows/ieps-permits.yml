name: IEPS Integrated Permit Disclosures
# 통합환경허가 정보공개 — 국립환경과학원 통합환경허가시스템 '정보공개 > 통합허가' 게시판의 출입처 사업장 통합허가·변경허가 글.
# 평일 13:40 KST(Cloudflare 요청, GitHub 예약은 대비용). 목록 3쪽·결과서 PDF 2건까지, 요청 사이 2초.
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만(회사·사업장 이름은 찍지 않는다).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ieps_permit_watch.py'
      - 'tests/test_ieps_permit_watch.py'
      - '.github/workflows/ieps-permits.yml'
  schedule:
    - cron: '50 5 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ieps-permits
  cancel-in-progress: false
jobs:
  ieps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "pypdf>=4,<6"
      - name: Test permit board parsing
        run: python -m unittest tests.test_ieps_permit_watch tests.test_private_store -v
      - name: Watch integrated permit disclosures (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/ieps_permit_watch.py
