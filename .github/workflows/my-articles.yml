name: My Articles Check
# 기자 기사 자동 대조 — 아이뉴스24 뉴스 사이트맵에서 출입처 이름이 든 새 기사의 작성자 메타가 홍성효인 것만 모아,
# 레이더가 그 기사 전에 같은 회사·사건 항목을 잡았는지 센다(기자 판정과 별개인 자동 기록). 매일 13:00·19:40 KST(Cloudflare 요청).
# 레이더 기억에 기자 전용 항목이 있어 결과는 기자 전용 저장소로만. 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/my_articles_check.py'
      - 'tests/test_my_articles_check.py'
      - '.github/workflows/my-articles.yml'
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: my-articles-check
  cancel-in-progress: false
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test matching rules
        run: python -m unittest tests.test_my_articles_check tests.test_reverse_prior_capture tests.test_private_store -v
      - name: Check own articles against radar memory (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/my_articles_check.py
