name: Earnings Season Compare
# 출입처 원가율·판관비율·영업이익률·직원 수 — 같은 보고기간 전년 동기 비교. 평일 18:40 KST.
# 코드가 바뀐 push와 수동 실행(기본값)은 운영 JSON을 쓰지 않고 요약만 남긴다(격리 검증).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/earnings_compare.py'
      - 'tests/test_earnings_compare.py'
      - '.github/workflows/earnings-compare.yml'
  schedule:
    - cron: '40 9 * * 1-5'
  workflow_dispatch:
    inputs:
      year:
        description: '사업연도(비우면 시즌에 맞춰 자동)'
        required: false
        default: ''
      report:
        description: '11013 1분기 / 11012 반기 / 11014 3분기 / 11011 사업보고서 (비우면 자동)'
        required: false
        default: ''
      publish:
        description: 'true면 운영 JSON 갱신, false면 요약만'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: earnings-season-compare
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Test ratio, headcount and failure handling
        run: python -m unittest discover -s tests -p 'test_earnings_compare.py' -v
      - name: Collect OpenDART statements and headcount
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          YEAR: ${{ github.event.inputs.year }}
          REPORT: ${{ github.event.inputs.report }}
          PUBLISH: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        run: |
          args=()
          [ -n "$YEAR" ] && args+=(--year "$YEAR")
          [ -n "$REPORT" ] && args+=(--report "$REPORT")
          if [ "$PUBLISH" = "true" ]; then
            python scripts/earnings_compare.py "${args[@]}"
          else
            python scripts/earnings_compare.py "${args[@]}" --annotate-only
          fi
      - name: Publish
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/earnings_compare_latest.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "data: refresh earnings season comparison [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
