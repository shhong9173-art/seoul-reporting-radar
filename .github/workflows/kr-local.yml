name: Local Government Notices Watch
# 출입처 공장이 있는 시·군의 고시·공고(새올 전자민원창구) 중 제목에 출입처 이름·공장 사업이 나온 새 고시·공고.
# 평일 06:30·16:20 KST(Cloudflare 요청이 정시 실행, GitHub 예약은 대비용). 결과는 기자 전용 저장소로만, 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_local_notice_watch.py'
      - 'tests/test_kr_local_notice_watch.py'
      - '.github/workflows/kr-local.yml'
  schedule:
    - cron: '30 21 * * 0-4'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kr-local-watch
  cancel-in-progress: false
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test notice parsing and grading
        run: python -m unittest tests.test_kr_local_notice_watch tests.test_private_store -v
      - name: Watch city and county notices (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/kr_local_notice_watch.py
