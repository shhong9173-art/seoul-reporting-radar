name: Governance Stake Watch
# 출입처 지분공시(5% 대량보유·임원/주요주주 소유보고) 최근 30일. 평일 07:40 KST.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/governance_watch.py'
      - 'tests/test_governance_watch.py'
      - '.github/workflows/governance-watch.yml'
  schedule:
    - cron: '40 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: governance-stake-watch
  cancel-in-progress: false
jobs:
  # GitHub 예약은 아침에 3시간쯤 늦게 온다(11-02: 06:50→10:03, 07:40→10:48, 08:10→11:28). 정시는 Cloudflare 워커가 요청하고,
  # 그 요청이 6시간 안에 성공했으면 늦게 온 예약 사본은 건너뛴다(요청이 실패했으면 예약이 대신 돈다).
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: governance-watch.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::6시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  stakes:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Test stake parsing and failure handling
        run: python -m unittest discover -s tests -p 'test_governance_watch.py' -v
      - name: Collect OpenDART stake filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/governance_watch.py --days 30
      - name: Publish
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/governance_latest.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "data: refresh beat stake and insider filings [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
