name: Governance Stake Watch
# 출입처 지분공시(5% 대량보유·임원/주요주주 소유보고) 최근 30일. 평일 07:40 KST.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/governance_watch.py'
      - 'tests/test_governance_watch.py'
      - '.github/workflows/governance-watch.yml'
  schedule:
    - cron: '40 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: governance-stake-watch
  cancel-in-progress: false
jobs:
  stakes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Test stake parsing and failure handling
        run: python -m unittest discover -s tests -p 'test_governance_watch.py' -v
      - name: Collect OpenDART stake filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/governance_watch.py --days 30
      - name: Publish
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/governance_latest.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "data: refresh beat stake and insider filings [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
