name: Official KIPRIS Patent Hunt
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patent_hunt.py'
      - '.github/workflows/kipris-patent-hunt.yml'
  schedule:
    # Mon-Fri 09:15 Asia/Seoul = 00:15 UTC
    - cron: '15 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: kipris-patent-evidence
  cancel-in-progress: false

jobs:
  patent:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official patent identity, publication date, and exclusions
        run: |
          python -m compileall -q scripts/patent_hunt.py
          python -m unittest discover -s tests -p 'test_patent_hunt.py' -v
          node tests/test_patent_hunt_view.cjs
      - name: Query KIPRISPlus applicant publications when separately authorized
        env:
          KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
        run: python scripts/patent_hunt.py --max-news 5
      - name: Publish official patent evidence only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/patent_hunt_latest.json
          if git diff --cached --quiet; then
            echo "No KIPRISPlus patent dataset changes"
            exit 0
          fi
          git commit -m "data: refresh verified KIPRIS patent disclosure hunt [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Official patent evidence publication failed" >&2
          exit 1
