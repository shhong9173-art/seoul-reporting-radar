name: Official KIPRIS Patent Hunt
on:
  # 병합(push)마다 실제 호출하던 것을 없앤다: 10월에 48번 중 33번이 병합으로 돌았다.
  # 코드 검사는 PR 검사가 맡고, 실제 호출은 정해진 시각과 수동 실행만.
  schedule:
    # Once each weekday at 06:30 KST instead of three full-list searches.
    # The source-only ledger is not a substitute for account-wide usage data.
    - cron: '30 21 * * 0-4'
  workflow_dispatch:
    inputs:
      force_provider_probe:
        description: "관리자 확인 후 22 재조회 1회 허용 (월/실행 호출 한도는 유지)"
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  # 상표 감시 등 같은 KIPRIS 키를 쓰는 작업과 차례로 돌아 공용 장부가 엇갈리지 않게 한다.
  group: kipris-account
  cancel-in-progress: false

jobs:
  # GitHub 예약(06:30)은 몇 시간씩 늦게 오거나 빠진다(10-29: 10시까지 안 옴). 정시 실행은 Cloudflare가 08:30에 요청하고,
  # 그 뒤 늦게 온 예약 실행은 6시간 안에 KIPRIS에 이미 물었으면 건너뛴다(같은 날 두 번 호출하지 않음).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          skip = "false"
          try:
              d = json.load(open("digests/kipris_source_request_budget_latest.json", encoding="utf-8"))
              last = dt.datetime.fromisoformat(str(d.get("lastProviderResponseAt")))
              age = (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 3600
              if os.environ.get("EVENT") == "schedule" and age < 6:
                  skip = "true"
                  print(f"::notice title=kipris-late-schedule::직전 KIPRIS 응답이 {age:.1f}시간 전 — 늦게 온 예약 실행이라 건너뜀")
          except (OSError, ValueError, TypeError) as e:
              print(f"::notice title=kipris-gate::직전 응답 시각 없음({type(e).__name__}) — 실행")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={skip}\n")
          PY
  patent:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official patent identity, publication date, and exclusions
        id: checks
        run: |
          python -m compileall -q scripts/patent_hunt.py scripts/patent_deep_hunt.py scripts/patent_story_hunt.py scripts/patent_run_health.py scripts/patent_quality_metrics.py scripts/patent_record_review.py scripts/patent_editorial_desk.py scripts/patent_cross_evidence.py scripts/patent_public_factcheck.py scripts/patent_reporting_triage.py scripts/patent_joint_verification.py
          python -m unittest discover -s tests -p 'test_patent_hunt.py' -v
          python -m unittest discover -s tests -p 'test_kipris_source_budget.py' -v
          python -m unittest discover -s tests -p 'test_kipris_account_ledger.py' -v
          python -m unittest discover -s tests -p 'test_patent_deep_hunt.py' -v
          python -m unittest discover -s tests -p 'test_patent_joint_verification.py' -v
          python -m unittest discover -s tests -p 'test_patent_claim_review.py' -v
          python -m unittest discover -s tests -p 'test_patent_story_hunt.py' -v
          python -m unittest discover -s tests -p 'test_patent_run_health.py' -v
          python -m unittest discover -s tests -p 'test_patent_quality_metrics.py' -v
          python -m unittest discover -s tests -p 'test_patent_editorial_desk.py' -v
          python -m unittest discover -s tests -p 'test_patent_cross_evidence.py' -v
          python -m unittest discover -s tests -p 'test_patent_reporting_triage.py' -v
          node tests/test_patent_hunt_view.cjs
          node tests/test_patent_joint_verification_view.cjs
      - name: Query KIPRISPlus applicant publications when separately authorized
        id: source
        env:
          KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
        run: python scripts/patent_hunt.py --max-news 5 ${{ inputs.force_provider_probe && '--force-provider-probe' || '' }}
      - name: Correlate joint publications and compare official historical patent titles
        id: deep
        env:
          KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
        run: python scripts/patent_deep_hunt.py --max-history 8
      - name: Build publication-grounded article angles and preliminary press checks
        id: story
        run: python scripts/patent_story_hunt.py --max-news 12
      - name: Measure human-reviewed newsroom quality and known-case replay
        id: quality
        run: python scripts/patent_quality_metrics.py
      - name: Compare verified claim1 of patent and older same-title disclosures
        id: claims
        continue-on-error: true
        env:
          KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
        run: python scripts/patent_claim_review.py --max-current 6 --max-prior 2
      - name: Build evidence-grounded editorial desk shortlist
        id: desk
        run: python scripts/patent_editorial_desk.py --top 5
      - name: Compare patent technology against independent DART evidence, never infer commercial application
        id: cross
        continue-on-error: true
        run: python scripts/patent_cross_evidence.py
      - name: Build reporter-feedback candidate order and human sample statistics
        id: triage
        continue-on-error: true
        run: python scripts/patent_reporting_triage.py
      - name: Correlate fresh cofiled patents with verified claim1 and press-index review
        id: joint_review
        continue-on-error: true
        run: python scripts/patent_joint_verification.py
      - name: Emit health result even if an earlier stage fails
        if: ${{ always() }}
        env:
          PIPELINE_CHECKS: ${{ steps.checks.outcome }}
          PIPELINE_SOURCE: ${{ steps.source.outcome }}
          PIPELINE_DEEP: ${{ steps.deep.outcome }}
          PIPELINE_STORY: ${{ steps.story.outcome }}
          PIPELINE_QUALITY: ${{ steps.quality.outcome }}
          PIPELINE_DESK: ${{ steps.desk.outcome }}
          PIPELINE_CROSS: ${{ steps.cross.outcome }}
          PIPELINE_TRIAGE: ${{ steps.triage.outcome }}
          PIPELINE_CLAIMS: ${{ steps.claims.outcome }}
        run: python scripts/patent_run_health.py
      - name: Publish checked evidence and pipeline health
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f digests/patent_run_health_latest.json ]; then git add digests/patent_run_health_latest.json; fi
          if [ -f digests/patent_source_status_latest.json ]; then git add digests/patent_source_status_latest.json; fi
          if [ -f digests/kipris_source_request_budget_latest.json ]; then git add digests/kipris_source_request_budget_latest.json; fi
          if [ -f digests/kipris_account_ledger_latest.json ]; then git add digests/kipris_account_ledger_latest.json; fi
          if [ "${{ steps.source.outcome }}" = "success" ]; then git add digests/patent_hunt_latest.json; fi
          if [ "${{ steps.deep.outcome }}" = "success" ] && [ -f digests/patent_deep_latest.json ]; then git add digests/patent_deep_latest.json; fi
          if [ "${{ steps.joint_review.outcome }}" = "success" ] && [ -f digests/patent_joint_verification_latest.json ]; then git add digests/patent_joint_verification_latest.json; fi
          if [ "${{ steps.claims.outcome }}" = "success" ] && [ -f digests/patent_claim_review_latest.json ]; then git add digests/patent_claim_review_latest.json; fi
          if [ "${{ steps.story.outcome }}" = "success" ] && [ -f digests/patent_story_latest.json ]; then git add digests/patent_story_latest.json; fi
          if [ "${{ steps.quality.outcome }}" = "success" ] && [ -f digests/patent_quality_latest.json ]; then git add digests/patent_quality_latest.json; fi
          if [ "${{ steps.desk.outcome }}" = "success" ] && [ -f digests/patent_desk_latest.json ]; then git add digests/patent_desk_latest.json; fi
          if [ "${{ steps.cross.outcome }}" = "success" ] && [ -f digests/patent_cross_evidence_latest.json ]; then git add digests/patent_cross_evidence_latest.json; fi
          if [ "${{ steps.triage.outcome }}" = "success" ] && [ -f digests/patent_reporting_triage_latest.json ]; then git add digests/patent_reporting_triage_latest.json; fi
          if git diff --cached --quiet; then
            echo "No KIPRISPlus patent dataset changes"
            exit 0
          fi
          git commit -m "data: refresh verified KIPRIS patent disclosure hunt [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Official patent evidence publication failed" >&2
          exit 1
