name: First-party Hyundai Reporter Dossiers
on:
  pull_request:
    paths:
      - 'data/primary_research_targets.json'
      - 'scripts/primary_document_dossiers.py'
      - 'scripts/primary_original_discovery.py'
      - 'data/primary_site_listing_watches.json'
      - 'tests/test_primary_original_discovery.py'
      - 'tests/test_primary_original_discovery_publishing.py'
      - 'scripts/publish_newsroom_outputs.py'
      - 'tests/test_primary_document_dossiers.py'
      - 'tests/test_primary_document_publishing.py'
      - 'tests/test_primary_dossiers_view.cjs'
      - 'primary-dossiers.html'
      - 'scoop_request.js'
      - 'scoop-request.html'
      - 'index.html'
      - 'tests/test_scoop_request.cjs'
      - '.github/workflows/primary-document-dossiers.yml'
  push:
    branches: [main]
    paths:
      - 'data/primary_research_targets.json'
      - 'scripts/primary_document_dossiers.py'
      - 'scripts/primary_original_discovery.py'
      - 'data/primary_site_listing_watches.json'
      - 'tests/test_primary_original_discovery.py'
      - 'tests/test_primary_original_discovery_publishing.py'
      - 'scripts/publish_newsroom_outputs.py'
      - 'primary-dossiers.html'
      - 'scoop_request.js'
      - 'scoop-request.html'
      - 'index.html'
      - 'tests/test_scoop_request.cjs'
      - '.github/workflows/primary-document-dossiers.yml'
  schedule:
    # Weekdays 08:30 and 15:00 KST
    - cron: '30 23 * * 0-4'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: first-party-reporter-dossiers
  cancel-in-progress: false

jobs:
  source-dossiers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source documents, editorial questions and non-exclusivity
        run: |
          python -m compileall -q scripts/primary_document_dossiers.py scripts/primary_original_discovery.py scripts/publish_newsroom_outputs.py
          python -m unittest discover -s tests -p 'test_primary_document_dossiers.py' -v
          python -m unittest discover -s tests -p 'test_primary_document_publishing.py' -v
          python -m unittest discover -s tests -p 'test_primary_original_discovery.py' -v
          python -m unittest discover -s tests -p 'test_primary_original_discovery_publishing.py' -v
          node tests/test_primary_dossiers_view.cjs
          node tests/test_scoop_request.cjs
      - name: Validate real checked-in four-source on-demand reporter shortlist
        run: |
          node - <<'NODE'
          const {build}=require('./scoop_request.js');
          const fs=require('node:fs');
          const base='digests/';
          const mapping={dossiers:'primary_research_dossiers_latest.json',
            discovery:'primary_original_discovery_latest.json',
            nhtsa:'nhtsa_part573_primary_latest.json',
            queue:'reporting_evidence_queue_latest.json'};
          const sources={};
          for(const [key,file] of Object.entries(mapping)){
            const path=base+file;
            if(fs.existsSync(path))sources[key]=JSON.parse(fs.readFileSync(path,'utf8'));
          }
          const out=build(sources,{company:'현대차',limit:5});
          console.log('Modern Hyundai request candidates:',out.totalCandidates,
             'returned:',out.displayed,
             'titles:',out.rows.map(x=>x.title));
          if(out.confirmedScoops!==0||out.pressAbsenceProved!==false)
            throw Error('unsafe automatic scoop state');
          if(out.totalCandidates<3)throw Error('live source documents not arriving in shortlist');
          NODE
      - name: Replay real official listing pages before merging (no publish)
        if: github.event_name == 'pull_request'
        run: |
          python -m scripts.primary_original_discovery
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('digests/primary_original_discovery_latest.json').read_text())
          for s in d['sources']:
              print(s['id'],s['status'],s.get('errorType',''),
                    'detail-matches',s.get('documentPagesMatched'))
          print('Real official listing sources:',d['sourcesChecked'],'/',d['sourcesAttempted'],
                '; company-linked detail pages:',d['candidateCount'])
          assert d['confirmedScoops']==0
          assert d['sourceCoverageExhaustive'] is False
          # Fail the PR when every real source is unreachable; this protects
          # against merging a selector that only works on synthetic fixtures.
          assert d['sourcesChecked']>=1,'all_original_listings_unreachable'
          PY
          # Exercise the exact standalone CLI mode, not only package-import tests.
          python scripts/publish_newsroom_outputs.py --mode primary_discovery --check-only
      - name: Fetch actual originals; record source failures, not zeros
        if: github.event_name != 'pull_request'
        run: |
          python -m scripts.primary_document_dossiers
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("digests/primary_research_dossiers_latest.json").read_text(encoding="utf-8"))
          assert o["status"]=="primary_original_reporter_dossiers_not_exclusive"
          assert o["caseCount"]>=5
          assert o["confirmedScoops"]==o["approvedArticles"]==0
          assert o["allDomesticPressChecked"] is False
          print("Originals matched",o["documentPagesMatched"],
                "/",o["documentRequestsAttempted"],
                "unavailable/mismatch",o["documentPagesFailedOrUnmatched"])
          PY
      - name: Discover newly observed named links from official listings
        if: github.event_name != 'pull_request'
        run: python -m scripts.primary_original_discovery
      - name: Atomic publish reporter records and official link discovery
        if: github.event_name != 'pull_request'
        run: |
          python scripts/publish_newsroom_outputs.py --mode primary_dossiers --check-only
          python scripts/publish_newsroom_outputs.py --mode primary_discovery --check-only
          python scripts/publish_newsroom_outputs.py --mode primary_dossiers
          python scripts/publish_newsroom_outputs.py --mode primary_discovery
