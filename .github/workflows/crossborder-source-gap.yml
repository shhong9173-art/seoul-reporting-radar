name: Overseas vs Korea Scoop Evidence Dossiers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crossborder-source-gap.yml'
      - 'scripts/crossborder_source_gap_triage.py'
      - 'scripts/dividend_period_gap.py'
      - 'tests/test_dividend_period_gap.py'
      - 'scripts/dart_foreign_dividend_watch.py'
      - 'scripts/slovakia_official_accounts.py'
      - 'scripts/slovak_ifrs_primary_pages.py'
      - 'scripts/slovak_ifrs_accounting_columns.py'
      - 'tests/test_slovak_ifrs_accounting_columns.py'
      - 'tests/test_slovak_ifrs_primary_pages.py'
      - 'scripts/czech_factory_official_identity.py'
      - 'scripts/nhtsa_part573_primary.py'
      - 'tests/test_nhtsa_part573_primary.py'
      - 'tests/test_czech_factory_official_identity.py'
      - 'tests/test_slovakia_official_accounts.py'
      - 'tests/test_crossborder_source_gap_triage.py'
      - 'crossborder-scoops.html'
  schedule:
    # Weekdays 09:10 Korea Standard Time (00:10 UTC)
    - cron: '10 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overseas-source-gap-dossier
  cancel-in-progress: false

jobs:
  build-reporter-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF source-text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v
      - name: Verify NHTSA, dividend, and source-gap semantic safeguards
        run: |
          python -m compileall -q scripts/crossborder_scoop_watch.py scripts/dart_foreign_dividend_watch.py scripts/crossborder_source_gap_triage.py
          python -m unittest discover -s tests -p 'test_crossborder_scoop_watch.py' -v
          python -m unittest discover -s tests -p 'test_crossborder_source_gap_triage.py' -v
          python -m unittest discover -s tests -p 'test_dividend_period_gap.py' -v
          python -m unittest discover -s tests -p 'test_slovakia_official_accounts.py' -v
          python -m unittest discover -s tests -p 'test_slovak_ifrs_primary_pages.py' -v
          python -m unittest discover -s tests -p 'test_slovak_ifrs_accounting_columns.py' -v
          python -m unittest discover -s tests -p 'test_czech_factory_official_identity.py' -v
          python -m unittest discover -s tests -p 'test_nhtsa_part573_primary.py' -v
          node tests/test_crossborder_source_gap_view.cjs
      - name: Check Kia Slovakia exact IČO and 2024-2025 individual accounts on Slovak Ministry of Finance RUZ API
        run: python scripts/slovakia_official_accounts.py
      - name: Extract hash-verified Slovak IFRS original PDF keyword pages without assuming cash transfers
        run: python scripts/slovak_ifrs_primary_pages.py
      - name: Check Hyundai Czech manufacturing entity in official Czech Finance Ministry ARES
        run: python scripts/czech_factory_official_identity.py
      - name: Fetch official NHTSA manufacturer Part 573 PDFs and review literal U.S. defect passages
        run: python scripts/nhtsa_part573_primary.py
      - name: Combine already-verified official source snapshots without inferring domestic no-recall or cash remittance
        run: python scripts/crossborder_source_gap_triage.py
      - name: Publish evidence-only newsroom dossier
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digests/crossborder_source_gap_latest.json digests/slovakia_official_accounts_latest.json digests/czech_factory_official_identity_latest.json digests/slovak_ifrs_primary_pages_latest.json digests/nhtsa_part573_primary_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: overseas official source gap reporter dossier [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo 'Failed to publish reporter official evidence dossier' >&2
          exit 1
