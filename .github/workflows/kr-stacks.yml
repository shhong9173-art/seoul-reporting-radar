name: Plant Stack Monitoring Watch (TMS)
# 출입처 공장 굴뚝 자동측정(한국환경공단 CleanSYS 실시간) — 배출구별 측정값을 3시간마다 쌓아 평소 움직이던 배출구가 멈춘 사업장,
# 새 배출구·목록에서 빠진 배출구를 본다. API는 지금 값만 주므로 이력은 이 실행이 쌓는다(GitHub 예약 3시간 간격, 늦어도 무방).
# 결과는 기자 전용 저장소로만. 공개 로그는 건수·원천 상태만(키 값은 출력하지 않음).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_stack_watch.py'
      - 'data/stack_watch.json'
      - 'tests/test_kr_stack_watch.py'
      - '.github/workflows/kr-stacks.yml'
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kr-stacks-watch
  cancel-in-progress: false
jobs:
  stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test stack rules and grading
        run: python -m unittest tests.test_kr_stack_watch tests.test_private_store -v
      - name: Watch plant stacks (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.KR_FUEL_API_KEY }}
        run: python scripts/kr_stack_watch.py
