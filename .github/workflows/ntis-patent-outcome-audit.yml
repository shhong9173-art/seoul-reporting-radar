name: NTIS Patent Outcome Provenance Audit
on:
  pull_request:
    paths:
      - 'scripts/ntis_outcome_reconcile.py'
      - 'digests/ntis_patent_outcomes_pc_latest.json'
      - 'scripts/ntis_patent_outcomes_pc_collect.ps1'
      - 'scripts/ntis_validate_patent_outcomes.py'
      - 'scripts/Run_NTIS_Patent_Outcomes_Collection.cmd'
      - 'tests/test_ntis_validate_patent_outcomes.py'
      - 'scripts/ntis_patent_outcome_probe.ps1'
      - 'scripts/Run_NTIS_Patent_Outcome_Check.cmd'
      - 'tests/test_ntis_outcome_reconcile.py'
      - 'tests/test_ntis_outcome_view.cjs'
      - 'patent-rnd-dossiers.html'
      - '.github/workflows/ntis-patent-outcome-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ntis_outcome_reconcile.py'
      - 'scripts/ntis_patent_outcomes_pc_collect.ps1'
      - 'scripts/ntis_validate_patent_outcomes.py'
      - 'scripts/Run_NTIS_Patent_Outcomes_Collection.cmd'
      - 'tests/test_ntis_validate_patent_outcomes.py'
      - 'scripts/ntis_patent_outcome_probe.ps1'
      - 'scripts/Run_NTIS_Patent_Outcome_Check.cmd'
      - 'digests/patent_rnd_dossiers_latest.json'
      - 'digests/ntis_project_leads_latest.json'
      - 'digests/ntis_patent_outcomes_pc_latest.json'
      - 'digests/patent_deep_latest.json'
      - '.github/workflows/ntis-patent-outcome-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntis-patent-outcome-audit-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject false patent/project identity and unsigned schema assumptions
        run: |
          python -m compileall -q scripts/ntis_outcome_reconcile.py
          python -m unittest discover -s tests -p 'test_ntis_outcome_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_ntis_validate_patent_outcomes.py' -v
          pwsh -NoProfile -File scripts/ntis_patent_outcome_probe.ps1 -SelfTest
          pwsh -NoProfile -File scripts/ntis_patent_outcomes_pc_collect.ps1 -SelfTest
          node tests/test_ntis_outcome_view.cjs
      - name: Check age of prior NTIS outcome input and rebuild offline evidence
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          def read(name):
              return json.loads(Path("digests", name).read_text(encoding="utf-8-sig"))
          
          def run(*args):
              subprocess.run([sys.executable, *args], check=True)
          
          source_path = Path("digests/ntis_patent_outcomes_pc_latest.json")
          if not source_path.exists():
              print("NTIS outcome input missing; no confirmed links claimed")
              run("scripts/ntis_outcome_reconcile.py")
              raise SystemExit(0)
          
          result = read("ntis_patent_outcomes_pc_latest.json")
          dossier = read("patent_rnd_dossiers_latest.json")
          deep = read("patent_deep_latest.json")
          projects = read("ntis_project_leads_latest.json")
          aligned = (
              result.get("dossierGeneratedAt") == dossier.get("generatedAt")
              and result.get("kiprisDeepGeneratedAt") == deep.get("generatedAt")
              and result.get("projectSourceGeneratedAt") == projects.get("generatedAt")
              and result.get("projectDossierGeneratedAt") == projects.get("dossierGeneratedAt")
          )
          if aligned:
              run("scripts/ntis_validate_patent_outcomes.py", str(source_path))
              run("scripts/ntis_outcome_reconcile.py", "--outcomes", str(source_path))
          else:
              if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
                  changed = subprocess.run(
                      ["git", "diff", "--name-only", "origin/main...HEAD", "--",
                       str(source_path)],
                      check=True, text=True, capture_output=True
                  ).stdout.strip()
                  if changed:
                      raise SystemExit(
                          "Newly submitted NTIS outcome file has stale KIPRIS/NTIS snapshots"
                      )
              print("HISTORICAL_NTIS_OUTCOME_INPUT: old source kept as archive, "
                    "not considered in today's number-matched evidence audit")
              run("scripts/ntis_outcome_reconcile.py")
          PY
      - name: Publish unverified outcome audit status
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ntis_patent_outcome_links_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: NTIS patent outcome linkage status [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
