name: NTIS Outcome Windows PC Regression
on:
  pull_request:
    paths:
      - 'scripts/ntis_patent_outcomes_pc_collect.ps1'
      - 'scripts/ntis_patent_discovery_pc.ps1'
      - 'scripts/ntis_patent_followup_pc.ps1'
      - 'scripts/ntis_followup_plan.py'
      - 'scripts/ntis_followup_validate.py'
      - 'scripts/Run_NTIS_Patent_Followup.cmd'
      - 'digests/ntis_patent_followup_plan_latest.json'
      - 'digests/ntis_patent_discovery_pc_latest.json'
      - 'tests/test_ntis_followup_plan.py'
      - 'tests/test_ntis_followup_validate.py'
      - 'scripts/ntis_validate_patent_discovery.py'
      - 'scripts/Run_NTIS_Patent_Discovery.cmd'
      - 'tests/test_ntis_validate_patent_discovery.py'
      - 'digests/patent_rnd_dossiers_latest.json'
      - 'digests/patent_deep_latest.json'
      - 'digests/ntis_project_leads_latest.json'
      - '.github/workflows/ntis-outcome-windows-pc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-approved-pc-offline-simulation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test NTIS patent result XML with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\ntis_patent_outcomes_pc_collect.ps1 -SelfTest
          .\scripts\ntis_patent_discovery_pc.ps1 -SelfTest
          .\scripts\ntis_patent_followup_pc.ps1 -SelfTest
      - name: Reproduce full pipeline using actual public snapshots without API key
        shell: powershell
        run: |
          .\scripts\ntis_patent_outcomes_pc_collect.ps1 -OfflineTest -SnapshotRoot "$env:GITHUB_WORKSPACE" -MaxTargets 7
          .\scripts\ntis_patent_discovery_pc.ps1 -OfflineTest -SnapshotRoot "$env:GITHUB_WORKSPACE" -MaxTargets 7 -MaxQueries 21 -MaxPages 1
          .\scripts\ntis_patent_followup_pc.ps1 -OfflineTest -KeepOfflineOutput -SnapshotRoot "$env:GITHUB_WORKSPACE"
      - name: Reject outcome discovery source confusion and false positives
        shell: powershell
        run: |
          python -m unittest discover -s tests -p 'test_ntis_validate_patent_discovery.py' -v
      - name: Verify pinned follow-up plan and synthetic output report
        shell: powershell
        run: |
          python scripts/ntis_followup_plan.py
          python scripts/ntis_followup_validate.py "$env:TEMP\ntis_patent_followup_offline.json"
          python -m unittest discover -s tests -p 'test_ntis_followup*.py' -v
