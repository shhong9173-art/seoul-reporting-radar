name: NTIS Project-ID Reverse Patent Outcome Regression
on:
  pull_request:
    paths:
      - 'scripts/ntis_project_reverse_plan.py'
      - 'scripts/ntis_project_reverse_validate.py'
      - 'scripts/ntis_project_reverse_pc.ps1'
      - 'scripts/ntis_project_page_followup_pc.ps1'
      - 'scripts/ntis_project_page_followup_validate.py'
      - 'scripts/Run_NTIS_Project_Page_Followup.cmd'
      - 'scripts/Run_NTIS_Project_Reverse.cmd'
      - 'scripts/Run_NTIS_Project_Reverse_Remaining_23.cmd'
      - 'digests/ntis_project_field_probe_pc_latest.json'
      - 'digests/ntis_project_reverse_remaining_23_pc_latest.json'
      - 'digests/ntis_project_page_followup_pc_latest.json'
      - 'tests/test_ntis_project_reverse_plan.py'
      - 'tests/test_ntis_project_page_followup_validate.py'
      - 'tests/test_ntis_project_page_followup_view.cjs'
      - 'tests/test_ntis_project_reverse_validate.py'
      - 'tests/test_ntis_project_reverse_view.cjs'
      - 'tests/test_ntis_remaining_23_view.cjs'
      - 'patent-rnd-dossiers.html'
      - 'digests/ntis_project_reverse_plan_latest.json'
      - 'digests/ntis_project_reverse_kipris_source.json'
      - 'digests/ntis_project_reverse_pc_latest.json'
      - '.github/workflows/ntis-project-reverse.yml'
  push:
    branches: [main]
    paths:
      - 'digests/ntis_project_reverse_pc_latest.json'
      - '.github/workflows/ntis-project-reverse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen project numbers, KIPRIS identities and no false reporting claims
        run: |
          python scripts/ntis_project_reverse_plan.py
          python -m unittest discover -s tests -p 'test_ntis_project_reverse*.py' -v
          node tests/test_ntis_project_reverse_view.cjs
          node tests/test_ntis_remaining_23_view.cjs
          node tests/test_ntis_project_page_followup_view.cjs
          python -m unittest discover -s tests -p 'test_ntis_project_page_followup_validate.py' -v
          if test -f digests/ntis_project_reverse_pc_latest.json; then
            python scripts/ntis_project_reverse_validate.py digests/ntis_project_reverse_pc_latest.json
            if grep -Eqi 'apprvKey|authorization|bearer |api[_-]?key|password|secret' digests/ntis_project_reverse_pc_latest.json; then
              echo 'Suspected credential in NTIS reverse lookup import'
              exit 1
            fi
          fi
          if test -f digests/ntis_project_reverse_remaining_23_pc_latest.json; then
            python scripts/ntis_project_reverse_validate.py digests/ntis_project_reverse_remaining_23_pc_latest.json
            if grep -Eqi 'apprvKey|authorization|bearer |api[_-]?key|password|secret' digests/ntis_project_reverse_remaining_23_pc_latest.json; then
              echo 'Suspected credential in NTIS remaining-23 reverse lookup import'
              exit 1
            fi
          fi
          if test -f digests/ntis_project_page_followup_pc_latest.json; then
            python scripts/ntis_project_page_followup_validate.py digests/ntis_project_page_followup_pc_latest.json
          fi
  windows-full-pipeline:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 official XML parser and index field test
        shell: powershell
        run: |
          .\scripts\ntis_project_reverse_pc.ps1 -SelfTest
      - name: Full 26-project reverse lookup with synthetic XML (never live NTIS)
        shell: powershell
        run: |
          .\scripts\ntis_project_reverse_pc.ps1 -OfflineTest -KeepOfflineOutput -SnapshotRoot "$env:GITHUB_WORKSPACE" -MaxProjects 26
          .\scripts\ntis_project_reverse_pc.ps1 -OfflineTest -KeepOfflineOutput -SnapshotRoot "$env:GITHUB_WORKSPACE" -MaxProjects 26 -SkipFirstProjects 3
      - name: Simulate exact 11-row 2-page NTIS gap scan (no live API)
        shell: powershell
        run: |
          .\scripts\ntis_project_page_followup_pc.ps1 -OfflineTest -SelfTest -SnapshotRoot "$env:GITHUB_WORKSPACE"
          .\scripts\ntis_project_page_followup_pc.ps1 -OfflineTest -SnapshotRoot "$env:GITHUB_WORKSPACE"
          python scripts/ntis_project_page_followup_validate.py "$env:TEMP\ntis_project_page_followup_offline.json" --allow-offline-test
      - name: Reject unrelated project IDs and patent registration-number false matches
        shell: powershell
        run: |
          python scripts/ntis_project_reverse_validate.py "$env:TEMP\ntis_project_reverse_offline.json"
          python scripts/ntis_project_reverse_validate.py "$env:TEMP\ntis_project_reverse_remaining_23_offline.json"
          python -m unittest discover -s tests -p 'test_ntis_project_reverse*.py' -v
          node tests/test_ntis_project_reverse_view.cjs
          node tests/test_ntis_remaining_23_view.cjs
