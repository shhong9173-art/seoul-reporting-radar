name: KR Official Watch
# 출입처 공장등록(팩토리온) 변화와 관보 입법예고(출입처 업종 관련). 평일 08:10 KST.
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만. 공공데이터포털 개발계정 하루 1,000회 안에서(실행당 약 40~80회).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_official_watch.py'
      - 'data/factory_watch.json'
      - 'tests/test_kr_official_watch.py'
      - '.github/workflows/kr-official.yml'
  schedule:
    - cron: '10 23 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kr-official-watch
  cancel-in-progress: false
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test parsing
        run: python -m unittest tests.test_kr_official_watch tests.test_private_store -v
      - name: Watch factory registry and gazette (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/kr_official_watch.py
