name: Trade Remedy Watch
# EU 철강 쿼터(TARIC) 한국 관련 소진, 미국 상무부·ITC 한국산 고시, 캐나다·인도·영국·인도네시아·베트남 무역구제 기관 목록, 국내 무역위원회, 미국 ITC 문서(EDIS). 평일 07:40·21:30, 토 09:30 KST(Cloudflare 칸 — 아래 cron은 07:40 예비).
# EDIS_API_TOKEN: EDIS 첨부(PDF) 내려받기용(14일 만료, EDIS 로그인 → 'API Token Generator'). 없으면 기본 정보만.
# 결과는 기자 전용 저장소로만. 공개 로그는 건수·원천별 상태만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/trade_remedy_watch.py'
      - 'scripts/ktc_watch.py'
      - 'scripts/ktc_producers.py'
      - 'scripts/listing_producers.py'
      - 'scripts/dgtr_cases.py'
      - 'scripts/dgtr_docs.py'
      - 'scripts/cbsa_cases.py'
      - 'scripts/au_epr_cases.py'
      - 'tests/test_ktc_watch.py'
      - 'scripts/kita_watch.py'
      - 'tests/test_kita_watch.py'
      - 'scripts/edis_watch.py'
      - 'tests/test_edis_watch.py'
      - 'scripts/tra_file_watch.py'
      - 'tests/test_tra_file_watch.py'
      - 'data/trade_remedy_pages.json'
      - 'tests/test_trade_remedy_watch.py'
      - '.github/workflows/trade-remedy.yml'
  schedule:
    - cron: '40 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trade-remedy-watch
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "pypdf>=4,<7" "olefile>=0.46,<1"
      # 인도 DGTR 개시 고시는 스캔 PDF(글자 0자)라 글자 인식으로 읽는다(11-14 탐침 235: 8쪽 21초). 설치가 안 되면 그 문서만 '못 읽음'으로 남는다
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null || echo "::warning title=ocr-tools::글자 인식 도구 설치 실패 — 스캔 PDF(DGTR 개시 고시)는 미확인"
      - name: Test trade remedy parsing
        run: python -m unittest tests.test_trade_remedy_watch tests.test_ktc_watch tests.test_ktc_producers tests.test_listing_producers tests.test_dgtr_cases tests.test_dgtr_docs tests.test_cbsa_cases tests.test_au_epr_cases tests.test_kita_watch tests.test_edis_watch tests.test_tra_file_watch tests.test_private_store -v
      - name: Watch trade remedies (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          EDIS_API_TOKEN: ${{ secrets.EDIS_API_TOKEN }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TRADE_NOTICE_FILE: ${{ runner.temp }}/trade_notices.txt
        run: python scripts/trade_remedy_watch.py
      # 알림은 한 단계에 10개까지만 보인다 — 수집기가 파일에 모은 줄(건수만)을 나눠 찍는다
      - name: Notices 1
        if: always()
        run: sed -n '1,9p' "$RUNNER_TEMP/trade_notices.txt" 2>/dev/null || true
      - name: Notices 2
        if: always()
        run: sed -n '10,18p' "$RUNNER_TEMP/trade_notices.txt" 2>/dev/null || true
      - name: Notices 3
        if: always()
        run: sed -n '19,27p' "$RUNNER_TEMP/trade_notices.txt" 2>/dev/null || true
