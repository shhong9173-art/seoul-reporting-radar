name: Cross-Source Scoop Evidence Expansion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nhtsa_investigations.py'
      - 'scripts/research_procurement.py'
      - 'scripts/customs_hs6.py'
      - 'scripts/recent_metric_hunt.py'
      - 'scoop-sources.html'
      - 'tests/test_scoop_sources_view.cjs'
      - 'tests/test_recent_metric_hunt.py'
      - 'tests/test_nhtsa_investigations.py'
      - 'tests/test_multisource_expansion.py'
      - '.github/workflows/cross-source-scoop.yml'
  schedule:
    - cron: '10 0 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-cross-source-scoop
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source hub and strict quarter/half-year DART metrics
        run: |
          python -m unittest discover -s tests -p 'test_recent_metric_hunt.py' -v
          node tests/test_scoop_sources_view.cjs

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify US ODI source and investigation identity
        run: |
          python -m unittest discover -s tests -p 'test_nhtsa_investigations.py' -v
          python scripts/nhtsa_investigations.py
      - name: Publish validated ODI records
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/nhtsa_investigations_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official US ODI investigation leads [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

  government:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test government source identity, lack of award proof, and HS6 formulas
        run: |
          python -m pip install "requests>=2.31,<3"
          python -m unittest discover -s tests -p 'test_multisource_expansion.py' -v
      - name: Retrieve separately authorized MSIT and procurement providers
        env:
          MSIT_API_KEY: ${{ secrets.MSIT_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python scripts/research_procurement.py
      - name: Publish only provider-approved public notices
        run: |
          set -e
          if [ ! -f digests/research_procurement_latest.json ]; then
            echo "MSIT/G2B not authorized: no fabricated subsidy or award"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/research_procurement_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official government open calls and procurement notices [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

  customs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate HS6 source
        run: |
          python -m pip install "requests>=2.31,<3"
          python -m unittest discover -s tests -p 'test_multisource_expansion.py' -v
      - name: Retrieve HS6 official country aggregates
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/customs_hs6.py
      - name: Publish verified HS6 comparison, never firm sales
        run: |
          set -e
          if [ ! -f digests/customs_hs6_latest.json ]; then
            echo "HS6 unavailable: no false zero"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/customs_hs6_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: validated customs HS6 annual comparisons [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
