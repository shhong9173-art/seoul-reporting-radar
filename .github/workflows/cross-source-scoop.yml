name: Cross-Source Scoop Evidence Expansion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nhtsa_investigations.py'
      - 'scripts/epa_echo_facilities.py'
      - 'tests/test_epa_echo_facilities.py'
      - 'scripts/research_procurement.py'
      - 'scripts/customs_hs6.py'
      - 'tests/test_customs_hs6_source_health.py'
      - 'scripts/recent_metric_hunt.py'
      - 'scoop-sources.html'
      - 'tests/test_scoop_sources_view.cjs'
      - 'tests/test_recent_metric_hunt.py'
      - 'tests/test_nhtsa_investigations.py'
      - 'tests/test_multisource_expansion.py'
      - '.github/workflows/cross-source-scoop.yml'
  schedule:
    - cron: '10 0 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-cross-source-scoop
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate source hub and strict quarter/half-year DART metrics
        run: |
          python -m unittest discover -s tests -p 'test_recent_metric_hunt.py' -v
          node tests/test_scoop_sources_view.cjs

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify US ODI source schema and unit tests
        run: python -m unittest discover -s tests -p 'test_nhtsa_investigations.py' -v
      - name: Retrieve official US opened investigations
        id: nhtsa
        run: python scripts/nhtsa_investigations.py
      - name: Publish successful ODI evidence or safe source diagnostics
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f digests/nhtsa_source_status_latest.json ]; then git add digests/nhtsa_source_status_latest.json; fi
          if [ "${{ steps.nhtsa.outcome }}" = "success" ] && [ -f digests/nhtsa_investigations_latest.json ]; then
            git add digests/nhtsa_investigations_latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official US ODI investigation leads [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

  epa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate US EPA facility matches and prohibit fake new permits
        run: python -m unittest discover -s tests -p 'test_epa_echo_facilities.py' -v
      - name: Search public EPA ECHO regulated facilities
        id: epa
        run: python scripts/epa_echo_facilities.py
      - name: Publish only actual official EPA facility registry records
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f digests/epa_source_status_latest.json ]; then git add digests/epa_source_status_latest.json; fi
          if [ "${{ steps.epa.outcome }}" = "success" ] && [ -f digests/epa_facilities_latest.json ]; then git add digests/epa_facilities_latest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official EPA ECHO facility registry evidence [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

  government:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test government source identity, lack of award proof, and HS6 formulas
        run: |
          python -m pip install "requests>=2.31,<3"
          python -m unittest discover -s tests -p 'test_multisource_expansion.py' -v
      - name: Retrieve separately authorized MSIT and procurement providers
        env:
          MSIT_API_KEY: ${{ secrets.MSIT_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python scripts/research_procurement.py
      - name: Publish only provider-approved public notices
        run: |
          set -e
          if [ ! -f digests/research_procurement_latest.json ]; then
            echo "MSIT/G2B not authorized: no fabricated subsidy or award"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/research_procurement_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official government open calls and procurement notices [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

  customs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate HS6 source
        run: |
          python -m pip install "requests>=2.31,<3"
          python -m unittest discover -s tests -p 'test_multisource_expansion.py' -v
          python -m unittest discover -s tests -p 'test_customs_hs6_source_health.py' -v
      - name: Retrieve HS6 official country aggregates
        id: collect_hs6
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/customs_hs6.py
      - name: Publish HS6 source failure status and only genuinely fresh totals
        if: ${{ always() && steps.collect_hs6.outcome != 'skipped' }}
        env:
          HS6_COLLECT_OUTCOME: ${{ steps.collect_hs6.outcome }}
        run: |
          set -e
          if [ ! -f digests/customs_hs6_source_health_latest.json ]; then
            echo "HS6 producer failed before status could be generated" >&2
            exit 1
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          h=json.loads(Path("digests/customs_hs6_source_health_latest.json").read_text())
          ok=os.environ["HS6_COLLECT_OUTCOME"]=="success"
          assert h["newSnapshotVerified"] is ok
          assert h["confirmedScoops"]==0
          assert h["zeroRowsProvesNoTrade"] is False
          if ok:
              assert h["status"]=="official_hs6_checked"
              d=json.loads(Path("digests/customs_hs6_latest.json").read_text())
              assert d["status"]=="verified_hs6_country_trade_only"
              assert d["items"]
          else:
              assert h["status"] in ("official_hs6_request_failed","official_hs6_key_missing")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/customs_hs6_source_health_latest.json
          if [ "$HS6_COLLECT_OUTCOME" = "success" ]; then
            git add digests/customs_hs6_latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: HS6 official provider health and guarded trade snapshot [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
