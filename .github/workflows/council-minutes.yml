name: Local Council Minutes Watch
# 지방의회 회의록 — 국회도서관 지방의정포털(CLIK) 회의록 API에서 출입처 이름 대목(인허가·불법·오염·감면·증설·이전 등).
# 매일 09:10 KST(Cloudflare 요청, GitHub 예약 09:15 대비용). 인증키 CLIK_API_KEY가 없으면 '미설정'으로 저장(0건 아님).
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/council_watch.py'
      - 'tests/test_council_watch.py'
      - '.github/workflows/council-minutes.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-minutes-watch
  cancel-in-progress: false
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test minutes parsing
        run: python -m unittest tests.test_council_watch tests.test_private_store -v
      - name: Watch council minutes (counts-only log)
        env:
          CLIK_API_KEY: ${{ secrets.CLIK_API_KEY }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/council_watch.py
