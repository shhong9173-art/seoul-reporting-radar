name: Customs 10-Day Provisional Trade
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/customs_tenday.py'
      - 'tests/test_customs_tenday.py'
      - '.github/workflows/customs-tenday.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/customs_tenday.py'
      - '.github/workflows/customs-tenday.yml'
  schedule:
    # Published on Korean 1st/11th/21st; 11:30 KST = 02:30 UTC
    - cron: '30 2 1,11,21 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customs-provisional-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Syntax and offline integrity tests (no secret)
        run: |
          python -m compileall -q scripts/customs.py scripts/customs_tenday.py
          python -m unittest discover -s tests -p 'test_customs_tenday.py' -v

  collect:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Collect only official 10-day cumulative observations
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/customs_tenday.py
      - name: Preserve existing output on API error; publish validated result
        run: |
          set -e
          if [ ! -f digests/customs_tenday_latest.json ]; then
            echo "Customs 10-day key missing or output not produced; no invented result"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/customs_tenday_latest.json
          if git diff --cached --quiet; then
            echo "Official provisional trade evidence unchanged"
          else
            git commit -m "data: refresh official provisional Customs trade [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
