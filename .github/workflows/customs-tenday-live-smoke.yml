name: Customs 10-Day Live Smoke (Temporary)
on:
  push:
    branches:
      - integration/customs-tenday-20261013
    paths:
      - .github/workflows/customs-tenday-live-smoke.yml
      - scripts/customs_tenday.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Validate both 10-day APIs without publishing
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          test -n "$CUSTOMS_API_KEY" || { echo "CUSTOMS_API_KEY secret missing"; exit 1; }
          python scripts/customs_tenday.py --output /tmp/customs_tenday_verified.json
          test -s /tmp/customs_tenday_verified.json
          echo "Official export/import 10-day responses validated"
