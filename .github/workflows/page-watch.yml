name: Official Page Change Watch
# 출입처 해외 공식 페이지(현대차·기아·제네시스 미국) 출시 시점·가격·판매 상태 문구 변화. 평일 06:30·18:30 KST.
# 결과는 기자 전용 저장소로만. 공개 로그에는 페이지별 응답 코드와 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/page_watch.py'
      - 'data/official_page_watch.json'
      - 'tests/test_page_watch.py'
      - '.github/workflows/page-watch.yml'
  schedule:
    - cron: '30 21 * * 0-4'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-page-watch
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test signal extraction and diffs
        run: python -m unittest tests.test_page_watch tests.test_private_store -v
      - name: Watch pages (codes and counts only)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/page_watch.py
