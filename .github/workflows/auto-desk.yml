name: Auto Desk News Update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.js'
      - 'data.json'
      - 'archive.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect auto industry news
        run: python collector.py

      - name: Build pitch score and persistent archive
        run: python archive_builder.py

      - name: Validate feed before publishing
        run: |
          python - <<'PY'
          import json
          raw=open('data.js',encoding='utf-8').read()
          prefix='window.ITEMS = '
          if not raw.startswith(prefix) or not raw.rstrip().endswith(';'):
              raise SystemExit('data.js format is invalid')
          items=json.loads(raw[len(prefix):].rstrip()[:-1])
          if len(items) < 10:
              raise SystemExit(f'collection returned only {len(items)} items; keeping previous feed')
          required={'title','url','published','sourceName','category','score','priority','pitchScore'}
          bad=[x for x in items if not required.issubset(x)]
          if bad:
              raise SystemExit(f'feed schema invalid: {len(bad)} items')
          with open('data.json',encoding='utf-8') as f: json_items=json.load(f)
          if json_items != items: raise SystemExit('data.json and data.js are inconsistent')
          with open('archive.json',encoding='utf-8') as f: archive=json.load(f)
          print(f'validated {len(items)} current items and {len(archive)} archive records')
          PY

      - name: Commit updated feed and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.json archive.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: refresh auto desk feed and archive"
            git push
          fi
