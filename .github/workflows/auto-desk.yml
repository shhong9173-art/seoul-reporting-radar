name: Auto Desk News Update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.js'
      - 'data.json'
      - 'global.json'
      - 'archive.json'
      - 'dart.json'
      - 'dart_numeric.json'
      - 'pitch.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect domestic auto industry news
        run: python collector.py

      - name: Collect dedicated global radar
        run: python global_collector.py

      - name: Collect DART disclosure radar
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_collector.py

      - name: Build pitch score and persistent archive
        run: python archive_builder.py

      - name: Normalize pitch pair orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pitch_builder.py')
          s=p.read_text(encoding='utf-8')
          old='frame,angle=PAIR_FRAMES[pair]'
          new="frame,angle=PAIR_FRAMES.get(pair, PAIR_FRAMES.get((pair[1], pair[0])))"
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Build cross-source pitch items
        run: python pitch_builder.py

      - name: Enrich pitch items with DART disclosures
        run: python dart_enrich_pitch.py

      - name: Extract numeric facts from DART originals
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        continue-on-error: true
        run: python dart_numeric_extractor.py

      - name: Enrich pitch items with DART numeric facts
        continue-on-error: true
        run: python dart_numeric_enrich_pitch.py

      - name: Validate feed before publishing
        run: |
          python - <<'PY'
          import json
          raw=open('data.js',encoding='utf-8').read()
          prefix='window.ITEMS = '
          if not raw.startswith(prefix) or not raw.rstrip().endswith(';'):
              raise SystemExit('data.js format is invalid')
          items=json.loads(raw[len(prefix):].rstrip()[:-1])
          if len(items) < 10:
              raise SystemExit(f'collection returned only {len(items)} items; keeping previous feed')
          domestic=[x for x in items if not x.get('global')]
          globals_=[x for x in items if x.get('global')]
          domestic_required={'title','url','published','sourceName','category','score','priority'}
          global_required={'title','url','published','sourceName','category'}
          bad_domestic=[x for x in domestic if not domestic_required.issubset(x)]
          bad_global=[x for x in globals_ if not global_required.issubset(x)]
          if bad_domestic:
              raise SystemExit(f'domestic feed schema invalid: {len(bad_domestic)} items')
          if bad_global:
              raise SystemExit(f'global feed schema invalid: {len(bad_global)} items')
          if not globals_:
              raise SystemExit('global radar returned 0 records; keeping previous feed')
          with open('data.json',encoding='utf-8') as f: json_items=json.load(f)
          if json_items != items: raise SystemExit('data.json and data.js are inconsistent')
          with open('global.json',encoding='utf-8') as f: global_items=json.load(f)
          if len(global_items) != len(globals_): raise SystemExit('global.json and data.js are inconsistent')
          with open('dart.json',encoding='utf-8') as f: dart=json.load(f)
          if not isinstance(dart,dict) or 'items' not in dart: raise SystemExit('dart.json is invalid')
          with open('pitch.json',encoding='utf-8') as f: pitches=json.load(f)
          if not isinstance(pitches,list): raise SystemExit('pitch.json is invalid')
          try:
              with open('dart_numeric.json',encoding='utf-8') as f: numeric=json.load(f)
          except FileNotFoundError:
              numeric={'items':[]}
          if not isinstance(numeric,dict) or 'items' not in numeric: raise SystemExit('dart_numeric.json is invalid')
          with open('archive.json',encoding='utf-8') as f: archive=json.load(f)
          print(f'validated {len(items)} current items, {len(globals_)} global records, {len(dart["items"])} DART disclosures, {len(numeric["items"])} numeric docs, {len(pitches)} pitch items and {len(archive)} archive records')
          PY

      - name: Commit updated feed, pitches and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.json global.json archive.json dart.json pitch.json dart_numeric.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: refresh domestic global DART and pitch radar"
            git push
          fi
