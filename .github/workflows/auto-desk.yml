name: Auto Desk News Update
# manual refresh check 2026-09-29

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.js'
      - 'digests/auto_news_feed_health_latest.json'
      - 'digests/global_news_feed_health_latest.json'
      - 'data.json'
      - 'global.json'
      - 'archive.json'
      - 'changes.json'
      - 'strategic_shifts.json'
      - 'dart.json'
      - 'dart_numeric.json'
      - 'dart_corp_codes.json'
      - 'dart_refresh_status.json'
      - 'pitch.json'
      - 'industry.json'
      - 'dig_today.json'
      - 'scoop.json'
      - 'pre_scoop.json'
      - 'scoop.js'
      - 'index.html'
      - 'pre_scoop_radar.py'
      - 'scoop_scout.py'
      - 'dart_numeric_extractor.py'
      - '.github/workflows/auto-desk.yml'
      - '.github/workflows/scoop-radar.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Both workflows write scoop.json and dart_numeric.json. Serialize writers.
  group: newsroom-radar-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pipeline heartbeat
        run: echo "Auto Desk pipeline started at $(date -u +%FT%TZ)"
      - name: Validate news headline identity and sports homonym exclusions
        run: |
          python -m unittest discover -s tests -p 'test_news_headline_identity.py' -v
          python -m unittest discover -s tests -p 'test_collector_publication_dates.py' -v
          python -m unittest discover -s tests -p 'test_auto_news_feed_health.py' -v
      - name: Collect domestic auto industry news
        run: python collector.py
      - name: Validate industry RSS date and source-failure gates
        run: |
          python -m unittest discover -s tests -p 'test_industry_news_guard.py' -v
          python -m unittest discover -s tests -p 'test_industry_collector_dates.py' -v
      - name: Collect expanded industrial desk radar
        run: python industry_collector.py
      - name: Merge expanded industrial desk radar
        run: python merge_industry.py
      - name: Collect dedicated global radar
        env:
          # 외신 제목 번역을 워커(Workers AI)에 맡긴다(11-01) — 토큰은 워커 인증에만, 로그에는 건수만
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python global_collector.py
      - name: Filter repetitive follow-up coverage
        run: python followup_filter.py
      - name: Test official collectors offline
        run: python -m unittest discover -s tests -p 'test_official_collectors.py' -v
      - name: Refresh DART without blocking healthy news on source failure
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_refresh.py
      - name: Detect persistent company and industry changes
        run: python change_detector.py
      - name: Detect 30-day strategic shifts
        run: python strategic_shift_radar.py
      - name: Build reporter investigation radar
        run: python investigation_radar.py
      - name: Gate investigation items for reporter quality
        run: python investigation_quality_gate.py
      - name: Build pitch score and persistent archive
        run: python archive_builder.py
      - name: Validate unfiltered annual Korean press history index
        run: |
          python -m unittest discover -s tests -p 'test_press_coverage_index.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('digests/press_coverage_index_latest.json')
          index=json.loads(p.read_text(encoding='utf-8'))
          assert index['retentionDays']>=365
          assert index['status']=='observed_domestic_press_index_not_complete_coverage'
          assert not index['proofOfNoPriorCoverage']
          assert index['itemCount']==len(index['items'])
          assert all(not x['fulltextReviewed'] for x in index['items'])
          print('History index includes',index['itemCount'],'domestic observed headlines; no unreported claims')
          PY
      - name: Backfill historical industry [단독] headlines from rotating month×beat index queries
        env:
          # 11-02: 최근 4일은 네이버 뉴스 API로도 '단독 {출입처}'를 본다(구글 RSS에 없는 [단독] 제목 보강)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python -m unittest discover -s tests -p 'test_historical_exclusive_press_collector.py' -v
          python -m scripts.historical_exclusive_press_collector
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('digests/historical_exclusive_press_index_latest.json').read_text(encoding='utf-8'))
          assert h['status']=='historical_industry_exclusive_rss_partial_index'
          assert h['itemCount']==len(h['items'])
          assert h['allDomesticIndustryExclusivesCovered'] is False
          assert h['confirmedScoops']==0 and h['humanReviewedYPN']==0
          assert all(x['fulltextReviewed'] is False and x['rssIndexedHeadlineOnly'] is True for x in h['items'])
          print('Yearlong partial [단독] press search index',h['itemCount'],
                'completed queries',h['successfulWindowsThisRun'],
                'failed queries',h['failedWindowsThisRun'])
          PY
      - name: Compare recent [단독] observed by newsroom and historical RSS
        run: |
          python -m unittest discover -s tests -p 'test_recent_exclusive_recall_audit.py' -v
          python -m scripts.recent_exclusive_recall_audit
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('digests/recent_exclusive_recall_audit_latest.json').read_text(encoding='utf-8'))
          h=json.loads(Path('digests/historical_exclusive_press_index_latest.json').read_text(encoding='utf-8'))
          assert a['historySourceAt']==h['generatedAt']
          assert a['status']=='recent_exclusive_rss_cross_index_gap_not_exhaustive'
          assert a['rssCoverageExhaustive'] is False
          assert a['domesticUnreportedProved'] is False
          assert a['confirmedScoops']==0
          print('Observed current RSS overlap',a['observedInBoth'],
                'news-only',a['newsOnlyObserved'],
                'history-only',a['historyOnlyObserved'],
                '(source gap only, not scoop proof)')
          PY
      - name: Reverse trace observed industry exclusives with evidence-only labels
        run: |
          python -m unittest discover -s tests -p 'test_exclusive_reverse_trace.py' -v
          python -m unittest discover -s tests -p 'test_reverse_trace_source_leads.py' -v
          python scripts/exclusive_reverse_trace.py
          python - <<'PY'
          import json
          from pathlib import Path
          press=json.loads(Path('digests/press_coverage_index_latest.json').read_text())
          trace=json.loads(Path('digests/reverse_trace_latest.json').read_text())
          assert trace['pressIndexGeneratedAt']==press['generatedAt']
          historical=json.loads(Path('digests/historical_exclusive_press_index_latest.json').read_text())
          assert trace['historicalSearchIndexAt']==historical['generatedAt']
          assert trace['historicalSearchObservedRows']==historical['itemCount']
          assert trace['historicalSearchAllSourcesChecked'] is False
          assert trace['curatedLeadStatus']=='curated_official_original_candidates_chronology_unverified'
          assert trace['locatedOriginalCandidateArticleCount']==sum(
              'locatedOfficialOriginalCandidate' in x for x in trace['items'])
          assert trace['primaryDocumentPublishedBeforeMediaVerifiedCount']==0
          assert trace['locatedSupplementaryForeignOriginalReferences']==sum(
              len(x.get('locatedSupportingOfficialOriginals',[])) for x in trace['items'])
          assert trace['distinctLocatedOfficialOriginalDocuments']>=trace['locatedOriginalCandidateArticleCount']//max(1,trace['locatedOriginalCandidateArticleCount'])
          assert trace['secOfficialAcceptanceTimestampChecked'] is bool(
              trace['locatedSupplementaryForeignOriginalReferences'])
          assert trace['pressFulltextMatchedToOfficialOriginalCount']==0
          assert trace['sourcePrioritizationEvidenceSufficient'] is False
          assert trace['humanReviewedYPN']==trace['Y']+trace['P']+trace['N']
          assert trace['totalObservedExclusiveHeadlines']==len(trace['items'])
          assert trace['confirmedScoops']==trace['approvedArticles']==0
          assert trace['reliablePopulationReachEstimated'] is False
          print('reverse trace observed',trace['totalObservedExclusiveHeadlines'],
                'human Y/P/N',trace['humanReviewedYPN'],
                'unreviewed U',trace['unreviewedU'])
          PY
      - name: Match already indexed industry exclusives to official DART receipt review candidates
        run: |
          python -m unittest discover -s tests -p 'test_reverse_trace_dart_followups.py' -v
          python scripts/reverse_trace_dart_followups.py
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('digests/reverse_trace_dart_followups_latest.json').read_text(encoding='utf-8'))
          trace=json.loads(Path('digests/reverse_trace_latest.json').read_text(encoding='utf-8'))
          beat=json.loads(Path('digests/dart_beat_monitor_latest.json').read_text(encoding='utf-8'))
          off=json.loads(Path('digests/official_event_triage_latest.json').read_text(encoding='utf-8'))
          assert q['status']=='reverse_trace_dart_receipt_reading_queue_unverified'
          assert q['reverseTraceSourceAt']==trace['generatedAt']
          assert q['dartOfficialSourceAt']==beat['generatedAt']==off['beatWideDartSourceAt']
          assert q['candidatePairCount']==len(q['items'])
          assert q['humanValidatedYPN']==q['confirmedScoops']==q['approvedArticles']==0
          assert q['sourceCompletenessVerified'] is False
          assert all(x['automaticYPNDecision'] is False
                     and x['publicFactOverlapVerified'] is False
                     and x['exclusiveConfirmed'] is False for x in q['items'])
          print('DART↔historical press original reading candidates',
                q['candidatePairCount'],'confirmed scoops 0')
          PY
      - name: Normalize pitch pair orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pitch_builder.py'); s=p.read_text(encoding='utf-8')
          old='frame,angle=PAIR_FRAMES[pair]'
          new="frame,angle=PAIR_FRAMES.get(pair, PAIR_FRAMES.get((pair[1], pair[0])))"
          if old in s: p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Build strategy and industry pitch candidates
        run: python pitch_builder.py
      - name: Enrich pitch items with DART disclosures
        run: python dart_enrich_pitch.py
      - name: Enrich pitch items with DART numeric facts
        continue-on-error: true
        run: python dart_numeric_enrich_pitch.py
      - name: Deduplicate and restrict pitch items
        run: python pitch_dedup.py
      - name: Refresh DART diagnostics from current files
        run: python dart_health.py
      - name: Validate feed before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=open('data.js',encoding='utf-8').read(); prefix='window.ITEMS = '
          if not raw.startswith(prefix) or not raw.rstrip().endswith(';'): raise SystemExit('data.js format is invalid')
          items=json.loads(raw[len(prefix):].rstrip()[:-1])
          if len(items)<10: raise SystemExit(f'collection returned only {len(items)} items')
          domestic=[x for x in items if not x.get('global')]; globals_=[x for x in items if x.get('global')]
          req={'title','url','published','sourceName','category','score','priority'}; greq={'title','url','published','sourceName','category'}
          if any(not req.issubset(x) for x in domestic): raise SystemExit('domestic feed schema invalid')
          if any(not greq.issubset(x) for x in globals_): raise SystemExit('global feed schema invalid')
          if not globals_: raise SystemExit('global radar returned 0 records')
          if json.load(open('data.json',encoding='utf-8')) != items: raise SystemExit('data.js/data.json inconsistent')
          dart=json.load(open('dart.json',encoding='utf-8')); pitches=json.load(open('pitch.json',encoding='utf-8'))
          numeric=json.load(open('dart_numeric.json',encoding='utf-8')) if Path('dart_numeric.json').exists() else {'items':[]}
          archive=json.load(open('archive.json',encoding='utf-8'))
          changes=json.load(open('changes.json',encoding='utf-8')) if Path('changes.json').exists() else {'changes':[],'snapshots':[]}
          shifts=json.load(open('strategic_shifts.json',encoding='utf-8')) if Path('strategic_shifts.json').exists() else {'items':[]}
          dig=json.load(open('dig_today.json',encoding='utf-8')) if Path('dig_today.json').exists() else {'items':[]}
          scoop=json.load(open('scoop.json',encoding='utf-8')) if Path('scoop.json').exists() else {'items':[]}
          pre=json.load(open('pre_scoop.json',encoding='utf-8')) if Path('pre_scoop.json').exists() else {'items':[]}
          if not isinstance(dart,dict) or 'items' not in dart: raise SystemExit('dart.json invalid')
          if not isinstance(pitches,list): raise SystemExit('pitch.json invalid')
          if not isinstance(numeric,dict) or 'items' not in numeric: raise SystemExit('dart_numeric.json invalid')
          if not isinstance(archive,list): raise SystemExit('archive.json invalid')
          if not isinstance(changes,dict) or 'changes' not in changes: raise SystemExit('changes.json invalid')
          if not isinstance(shifts,dict) or 'items' not in shifts: raise SystemExit('strategic_shifts.json invalid')
          if not isinstance(dig,dict) or 'items' not in dig: raise SystemExit('dig_today.json invalid')
          if not isinstance(scoop,dict) or 'items' not in scoop: raise SystemExit('scoop.json invalid')
          if not isinstance(pre,dict) or 'items' not in pre: raise SystemExit('pre_scoop.json invalid')
          if len(scoop.get('items',[]))>60: raise SystemExit('too many scoop candidates')
          if not isinstance(dig.get('qualityGate'),dict): raise SystemExit('investigation quality gate metadata missing')
          a=sum(1 for p in pitches if p.get('grade')=='A'); linked=sum(1 for p in pitches if p.get('dartNumericSignals'))
          industry=sum(1 for x in items if x.get('industrySource')); auto=sum(1 for x in items if x.get('category') in {'완성차','부품','배터리','정책·관세','중국차','노조·생산','수주·투자','리콜·안전','단독','미국·글로벌'} and not x.get('global')); follow=sum(1 for x in items if x.get('followUp') and not x.get('global'))
          print(f'validated {len(items)} items / auto {auto} / expanded industry {industry} / {len(globals_)} global / {len(dart["items"])} DART / {len(numeric["items"])} numeric docs / {len(pitches)} pitches / {a} A-grade / {linked} numeric-linked / {follow} retained follow-up / {len(changes["changes"])} changes / {len(shifts["items"])} strategic shifts / {len(dig["items"])} investigation items / scoop {len(scoop["items"])} / quality {dig["qualityGate"].get("input")}->{dig["qualityGate"].get("output")}')
          if len(pitches)>3: raise SystemExit(f'pitch count {len(pitches)} exceeds max 3')
          if len(dig['items'])>5: raise SystemExit('too many investigation items')
          PY
      - name: Publish validated newsroom news outputs without rebase conflicts
        run: python scripts/publish_newsroom_outputs.py --mode news
      - name: Preserve RSS source health even if news collection failed
        if: ${{ always() }}
        run: python scripts/publish_newsroom_outputs.py --mode health
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest collected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify latest collected outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.load(open('data.json',encoding='utf-8')); pitches=json.load(open('pitch.json',encoding='utf-8')) if Path('pitch.json').exists() else []
          shifts=json.load(open('strategic_shifts.json',encoding='utf-8')) if Path('strategic_shifts.json').exists() else {'items':[]}
          dig=json.load(open('dig_today.json',encoding='utf-8')) if Path('dig_today.json').exists() else {'items':[]}
          scoop=json.load(open('scoop.json',encoding='utf-8')) if Path('scoop.json').exists() else {'items':[]}
          pre=json.load(open('pre_scoop.json',encoding='utf-8')) if Path('pre_scoop.json').exists() else {'items':[]}
          if not isinstance(items,list) or len(items)<10: raise SystemExit('Latest feed is invalid')
          if len(pitches)>3: raise SystemExit('Too many pitches in latest main')
          if not isinstance(shifts,dict) or 'items' not in shifts: raise SystemExit('Latest strategic shifts invalid')
          if not isinstance(dig,dict) or 'items' not in dig or not isinstance(dig.get('qualityGate'),dict): raise SystemExit('Latest investigation radar invalid')
          if not isinstance(scoop,dict) or 'items' not in scoop: raise SystemExit('Latest scoop radar invalid')
          if not isinstance(pre,dict) or 'items' not in pre: raise SystemExit('Latest pre-scoop radar invalid')
          print(f'latest main feed: {len(items)} items / pitches {len(pitches)} / strategic shifts {len(shifts["items"])} / investigation {len(dig["items"])} / scoop {len(scoop["items"])} / quality {dig["qualityGate"].get("input")}->{dig["qualityGate"].get("output")}')
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh deployed DART diagnostics
        run: python dart_health.py
      - name: Stamp browser asset cache versions
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); v=os.environ['BUILD_SHA']
          for asset in ('data.js','app.js','pitch.js','dashboard.js','dashboard_v2.js','industry_priority.js','auto_exclusive.js','cross_media_gap.js','boss_followup.js','nav_more.js','style.css','pitch.json','changes.json','strategic_shifts.json','dig_today.json','scoop.json'):
              s=re.sub(r'('+re.escape(asset)+r'\?v=)[^"\']+', r'\g<1>'+v, s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload latest site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy latest site
        id: deployment
        uses: actions/deploy-pages@v4
