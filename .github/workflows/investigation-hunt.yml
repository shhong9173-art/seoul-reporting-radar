name: Source-Delta Investigation Hunt
on:
  push:
    branches: [main]
    paths:
      - 'scripts/investigation_hunt.py'
      - '.github/workflows/investigation-hunt.yml'
  schedule:
    # Mon-Fri 08:45 KST = previous day 23:45 UTC
    - cron: '45 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-investigation-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact source rows and editorial restrictions
        run: |
          python -m compileall -q scripts/investigation_hunt.py
          python -m unittest discover -s tests -p 'test_investigation_hunt.py' -v
          node tests/test_hunt_view.cjs
      - name: Detect official DART investment revisions and prior coverage
        run: python scripts/investigation_hunt.py --max-news 4
      - name: Publish verified facts and desk prompts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/investigation_hunt_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: source-delta reporter hunt [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Could not publish source-delta investigation evidence" >&2
          exit 1
