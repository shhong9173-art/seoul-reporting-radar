name: Source-Delta Investigation Hunt
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/investigation_hunt.py'
      - 'tests/test_investigation_hunt.py'
      - 'hunt.html'
      - '.github/workflows/investigation-hunt.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/investigation_hunt.py'
      - 'scripts/recent_metric_hunt.py'
      - 'tests/test_recent_metric_hunt.py'
      - '.github/workflows/investigation-hunt.yml'
  schedule:
    # Mon-Fri 08:45 KST = previous day 23:45 UTC
    - cron: '45 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-investigation-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact source rows and editorial restrictions
        run: |
          python -m compileall -q scripts/investigation_hunt.py scripts/recent_metric_hunt.py
          python -m unittest discover -s tests -p 'test_recent_metric_hunt.py' -v
          python -m unittest discover -s tests -p 'test_investigation_hunt.py' -v
          node tests/test_hunt_view.cjs
      - name: Detect official DART investment revisions and prior coverage
        if: github.event_name != 'pull_request'
        run: python scripts/investigation_hunt.py --max-news 4
      - name: Replay current operational disclosures without publishing
        if: github.event_name == 'pull_request'
        run: |
          python scripts/investigation_hunt.py --max-news 0 --output /tmp/investigation-replay.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/investigation-replay.json'))
          assert d['scoopConfirmed']==0
          for card in d['investigations']:
              print(card['company'], card['reporterStatus'], len(card['publicFactQuestions']))
              assert card['publicFactQuestions']
              assert all(q['sourceUrls'] for q in card['publicFactQuestions'])
          PY
      - name: Identify conservative same-year quarter/half-year DART numeric changes
        run: python scripts/recent_metric_hunt.py
      - name: Publish verified facts and desk prompts
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/investigation_hunt_latest.json digests/recent_metric_changes_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: source-delta reporter hunt [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Could not publish source-delta investigation evidence" >&2
          exit 1
