name: Customs Tenday Full Live Validation Temporary
on:
  push:
    branches: [integration/customs-tenday-20261013]
    paths:
      - '.github/workflows/customs-tenday-verify-temporary.yml'
      - 'scripts/customs_tenday.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Full real-data parsing and YoY, with secret masked and no publication
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          set -e
          test -n "$CUSTOMS_API_KEY"
          python -m unittest discover -s tests -p test_customs_tenday.py -v
          python scripts/customs_tenday.py --output /tmp/verified_customs_tenday.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/verified_customs_tenday.json'))
          assert len(d["observed"])>=4
          assert len(d["focus"])==10
          assert {x["series"] for x in d["focus"]}=={"exp_item","imp_item"}
          assert {x["comparisonStatus"] for x in d["focus"]}=={"전년 동일 누적구간"}
          print("VERIFIED_TENDAY_LIVE_SUCCESS observations",len(d["observed"]),"focus",len(d["focus"]),"months",sorted({x["month"] for x in d["focus"]}))
          PY
