name: Patent R&D Evidence Dossier
on:
  pull_request:
    paths:
      - 'scripts/patent_rnd_dossier.py'
      - 'tests/test_patent_rnd_dossier.py'
      - 'tests/test_patent_rnd_dossier_view.cjs'
      - 'patent-rnd-dossiers.html'
      - 'index.html'
      - 'patents.html'
      - '.github/workflows/patent-rnd-dossier.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/patent_rnd_dossier.py'
      - 'tests/test_patent_rnd_dossier.py'
      - 'tests/test_patent_rnd_dossier_view.cjs'
      - 'patent-rnd-dossiers.html'
      - '.github/workflows/patent-rnd-dossier.yml'
  schedule:
    # 07:25, 13:35, 18:40 KST weekdays, after patent cross-check.
    - cron: '25 22 * * 0-4'
    - cron: '35 4 * * 1-5'
    - cron: '40 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patent-rnd-dossier-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject false R&D links and stale business evidence
        run: |
          python -m compileall -q scripts/patent_rnd_dossier.py
          python -m unittest discover -s tests -p 'test_patent_rnd_dossier.py' -v
          node tests/test_patent_rnd_dossier_view.cjs
      - name: Build dossier from matched official snapshots, no credentials needed
        if: ${{ github.event_name != 'pull_request' }}
        run: python scripts/patent_rnd_dossier.py
      - name: Publish checked researcher dossiers
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/patent_rnd_dossiers_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh patent R&D evidence dossiers [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
