name: KIPRIS Secret Live Verification (Temporary)
on:
  push:
    branches:
      - diagnostics/kipris-secret-smoke-20261013
    paths:
      - '.github/workflows/kipris-secret-smoke-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check KIPRIS key and call actual existing patent endpoint without writing files
        env:
          KIPRIS_SERVICE_KEY: ${{ secrets.KIPRIS_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os,sys,datetime,urllib.error,xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0,str(Path("scripts").resolve()))
          import patent_hunt as p
          key=os.environ.get("KIPRIS_SERVICE_KEY","").strip()
          if not key:
            print("KIPRIS_SECRET_STATUS=MISSING")
            raise SystemExit(2)
          print("KIPRIS_SECRET_STATUS=PRESENT")
          now=datetime.datetime.now(p.KST)
          start=(now-datetime.timedelta(days=35)).strftime("%Y%m%d")
          end=now.strftime("%Y%m%d")
          try:
            response=p.search_applicant(key,"현대자동차",start,end,max_pages=1)
            print("KIPRIS_API_STATUS=VALID_XML")
            print("KIPRIS_API_TOTAL_COUNT",response["total"])
            print("KIPRIS_API_ROWS_RECEIVED",len(response["rows"]))
            print("KIPRIS_API_PAGINATED",not response["complete"])
            print("KIPRIS_LIVE_SUCCESS")
          except urllib.error.HTTPError as exc:
            # Never emit HTTPError itself: its URL includes the private ServiceKey.
            print("KIPRIS_API_STATUS=HTTP_ERROR",exc.code)
            raise SystemExit(3)
          except urllib.error.URLError as exc:
            print("KIPRIS_API_STATUS=NETWORK_ERROR",type(exc.reason).__name__)
            raise SystemExit(4)
          except (ET.ParseError,ValueError,RuntimeError) as exc:
            # Existing parser is strict; classify without exposing raw response.
            print("KIPRIS_API_STATUS=PARSE_OR_API_ERROR",type(exc).__name__)
            raise SystemExit(5)
          except Exception as exc:
            print("KIPRIS_API_STATUS=UNEXPECTED_ERROR",type(exc).__name__)
            raise SystemExit(6)
          PY
