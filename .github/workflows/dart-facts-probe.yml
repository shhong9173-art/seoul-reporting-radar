name: DART Facts Probe (isolated, branch only)
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/probe/dart_facts_probe.py
