name: Official Overseas & Contract Leads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-overseas-contracts.yml'
      - 'scripts/overseas_official.py'
      - 'scripts/federal_register_evidence.py'
      - 'scripts/recent_contracts.py'
      - 'scripts/dart_lineage.py'
      - 'tests/test_dart_issuer_table_review.py'
      - 'scripts/dart_contract_tables.py'
      - 'tests/test_dart_contract_tables.py'
      - 'scripts/dart_contract_followup.py'
      - 'scripts/dart_correction_history.py'
      - 'tests/test_dart_correction_history.py'
      - 'tests/test_dart_correction_history_view.cjs'
      - 'dart-correction-history.html'
      - 'tests/test_dart_contract_followup.py'
      - 'tests/test_dart_contract_followup_view.cjs'
      - 'dart-contract-followup.html'
  schedule:
    # Mon-Fri 08:10 Asia/Seoul (Sunday-Thursday 23:10 UTC)
    - cron: '10 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-overseas-contracts
  cancel-in-progress: false

jobs:
  # GitHub 예약은 아침에 3시간쯤 늦게 온다(11-02: 06:50→10:03, 07:40→10:48, 08:10→11:28). 정시는 Cloudflare 워커가 요청하고,
  # 그 요청이 6시간 안에 성공했으면 늦게 온 예약 사본은 건너뛴다(요청이 실패했으면 예약이 대신 돈다).
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: official-overseas-contracts.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::6시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  overseas:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test official providers and source identity
        run: |
          python -m compileall -q scripts/overseas_official.py scripts/recent_contracts.py
          python -m unittest discover -s tests -p 'test_official_foreign_contracts.py' -v
      - name: Search US federal published notices and EU TED published tenders
        run: python scripts/overseas_official.py
      - name: Verify bounded Federal Register original body mentions
        run: |
          python -m unittest discover -s tests -p 'test_federal_register_evidence.py' -v
          python scripts/federal_register_evidence.py
      - name: Publish only verified official matches
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/overseas_official_latest.json
          git add digests/federal_register_evidence_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: official overseas notice evidence [skip ci]"
          for retry in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Failed to publish official overseas docs" >&2
          exit 1

  dart_contracts:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test issuer and DART lineage source controls
        run: |
          python -m compileall -q scripts/recent_contracts.py scripts/dart_contract_followup.py scripts/dart_contract_tables.py scripts/dart_correction_history.py
          python -m unittest discover -s tests -p 'test_dart_contract_tables.py' -v
          python -m unittest discover -s tests -p 'test_official_foreign_contracts.py' -v
          python -m unittest discover -s tests -p 'test_dart_lineage.py' -v
          python -m unittest discover -s tests -p 'test_dart_issuer_table_review.py' -v
          python -m unittest discover -s tests -p 'test_dart_contract_followup.py' -v
          python -m unittest discover -s tests -p 'test_dart_correction_history.py' -v
          node tests/test_dart_correction_history_view.cjs
          node tests/test_dart_contract_followup_view.cjs
      - name: Audit direct-beat official contract and investment events
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/recent_contracts.py --limit 9
      - name: Cross-check real DART fields with two bounded prior-news index queries per filing
        run: python scripts/dart_contract_followup.py --limit 9
      - name: Fetch bounded historical official DART candidates and retain article-index uncertainty
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_correction_history.py
      - name: Publish verified DART source evidence
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/recent_contracts_latest.json
          if test -f digests/dart_contract_followup_latest.json; then git add digests/dart_contract_followup_latest.json; fi
          if test -f digests/dart_correction_history_latest.json; then git add digests/dart_correction_history_latest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh official contract events [skip ci]"
          for retry in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Failed to publish DART contract ledger" >&2
          exit 1
