name: Deploy Auto Desk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          python -m py_compile collector.py
          python -m py_compile global_collector.py
          python -m py_compile archive_builder.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser script syntax
        run: node --check app.js

      - name: Collect domestic auto desk feed
        run: python collector.py

      - name: Collect dedicated global radar
        run: python global_collector.py

      - name: Build pitch scores and persistent archive
        run: python archive_builder.py

      - name: Verify browser data
        run: |
          python - <<'PY'
          import json
          with open('data.json',encoding='utf-8') as f:
              items=json.load(f)
          with open('archive.json',encoding='utf-8') as f:
              archive=json.load(f)
          if not isinstance(items,list) or len(items)<10:
              raise SystemExit(f'Invalid data feed: {len(items) if isinstance(items,list) else 0} items')
          if any('title' not in x or 'url' not in x for x in items):
              raise SystemExit('Feed schema is invalid')
          globals_count=sum(1 for x in items if x.get('global'))
          if globals_count < 1:
              raise SystemExit('Global feed is empty')
          print(f'Pages feed ready: {len(items)} items / {globals_count} global / {len(archive)} archived')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
