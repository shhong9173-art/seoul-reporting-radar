name: Deploy Auto Desk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          python -m py_compile collector.py
          python -m py_compile global_collector.py
          python -m py_compile dart_collector.py
          python -m py_compile dart_enrich_pitch.py
          python -m py_compile archive_builder.py
          python -m py_compile pitch_builder.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser script syntax
        run: node --check app.js && node --check pitch.js

      - name: Collect domestic auto desk feed
        run: python collector.py

      - name: Collect dedicated global radar
        run: python global_collector.py

      - name: Collect DART disclosure radar
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_collector.py

      - name: Build pitch score and persistent archive
        run: python archive_builder.py

      - name: Normalize pitch pair orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pitch_builder.py')
          s=p.read_text(encoding='utf-8')
          old='frame,angle=PAIR_FRAMES[pair]'
          new="frame,angle=PAIR_FRAMES.get(pair, PAIR_FRAMES.get((pair[1], pair[0])))"
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Build cross-source pitch items
        run: python pitch_builder.py

      - name: Enrich pitch items with DART disclosures
        run: python dart_enrich_pitch.py

      - name: Stamp browser asset cache versions
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v=os.environ['BUILD_SHA']
          for asset in ('data.js','app.js','pitch.js','style.css','pitch.json'):
              s=re.sub(r'('+re.escape(asset)+r'\?v=)[^"\']+', r'\g<1>'+v, s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify browser data
        run: |
          python - <<'PY'
          import json
          items=json.load(open('data.json',encoding='utf-8'))
          archive=json.load(open('archive.json',encoding='utf-8'))
          pitches=json.load(open('pitch.json',encoding='utf-8'))
          dart=json.load(open('dart.json',encoding='utf-8'))
          if not isinstance(items,list) or len(items)<10: raise SystemExit('Invalid data feed')
          if any('title' not in x or 'url' not in x for x in items): raise SystemExit('Feed schema is invalid')
          globals_count=sum(1 for x in items if x.get('global'))
          if globals_count < 1: raise SystemExit('Global feed is empty')
          if not isinstance(pitches,list): raise SystemExit('Pitch output is invalid')
          if any('headline' not in x or 'evidence' not in x for x in pitches): raise SystemExit('Pitch schema is invalid')
          if not isinstance(dart,dict) or 'items' not in dart: raise SystemExit('DART output is invalid')
          print(f'Pages feed ready: {len(items)} items / {globals_count} global / {len(dart["items"])} DART disclosures / {len(archive)} archived / {len(pitches)} pitch items')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
