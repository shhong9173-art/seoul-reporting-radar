name: Deploy Auto Desk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed radar outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          items=json.load(open('data.json',encoding='utf-8'))
          archive=json.load(open('archive.json',encoding='utf-8'))
          pitches=json.load(open('pitch.json',encoding='utf-8')) if Path('pitch.json').exists() else []
          dart=json.load(open('dart.json',encoding='utf-8')) if Path('dart.json').exists() else {'items':[]}
          numeric=json.load(open('dart_numeric.json',encoding='utf-8')) if Path('dart_numeric.json').exists() else {'items':[]}

          if not isinstance(items,list) or len(items)<10:
              raise SystemExit('Invalid data feed')
          dom=[x for x in items if not x.get('global')]
          glob=[x for x in items if x.get('global')]
          dom_required={'title','url','published','sourceName','category','score','priority'}
          glob_required={'title','url','published','sourceName','category'}
          if any(not dom_required.issubset(x) for x in dom):
              raise SystemExit('Domestic feed schema is invalid')
          if any(not glob_required.issubset(x) for x in glob):
              raise SystemExit('Global feed schema is invalid')
          if not glob:
              raise SystemExit('Global feed is empty')
          if not isinstance(archive,list):
              raise SystemExit('Archive output is invalid')
          if not isinstance(pitches,list):
              raise SystemExit('Pitch output is invalid')
          if any('headline' not in x or 'evidence' not in x for x in pitches):
              raise SystemExit('Pitch schema is invalid')
          if not isinstance(dart,dict) or 'items' not in dart:
              raise SystemExit('DART output is invalid')
          if not isinstance(numeric,dict) or 'items' not in numeric:
              raise SystemExit('DART numeric output is invalid')
          linked=sum(1 for p in pitches if p.get('dartNumericSignals'))
          print(f'Pages ready: {len(items)} items / {len(glob)} global / {len(dart["items"])} DART disclosures / {len(numeric["items"])} numeric docs / {len(archive)} archived / {len(pitches)} pitch items / {linked} numeric-linked pitches')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp browser asset cache versions
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v=os.environ['BUILD_SHA']
          for asset in ('data.js','app.js','pitch.js','style.css','pitch.json'):
              s=re.sub(r'('+re.escape(asset)+r'\?v=)[^"\']+', r'\g<1>'+v, s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
