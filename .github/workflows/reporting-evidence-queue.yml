name: Evidence-first Reporter Queue
on:
  pull_request:
    paths:
      - 'scripts/reporting_evidence_queue.py'
      - 'scripts/publish_newsroom_outputs.py'
      - 'tests/test_reporting_evidence_queue.py'
      - 'tests/test_reporting_queue_view.cjs'
      - 'reporting-queue.html'
      - 'index.html'
      - '.github/workflows/reporting-evidence-queue.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reporting_evidence_queue.py'
      - 'reporting-queue.html'
      - '.github/workflows/reporting-evidence-queue.yml'
  schedule:
    # 10:00 / 14:00 / 18:00 KST daily INCLUDING weekends.
    # Only replays already-collected official documents; no extra API budget.
    - cron: '0 1,5,9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reporting-evidence-queue
  cancel-in-progress: false
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check verified source identity, dates and no-scoop editorial gates
        run: |
          python -m compileall -q scripts/reporting_evidence_queue.py
          python -m unittest discover -s tests -p 'test_reporting_evidence_queue.py' -v
          node tests/test_reporting_queue_view.cjs
      - name: Replay actual collected records without online API calls
        run: |
          python scripts/reporting_evidence_queue.py --out /tmp/reporting-evidence-queue.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reporting-evidence-queue.json',encoding='utf-8'))
          assert d['confirmedScoops']==d['approvedArticles']==0
          assert d['totalRows']==len(d['items'])
          assert all(not x['exclusiveConfirmed'] and not x['approvedForPitch'] for x in d['items'])
          assert all(x['officialDateIsSourcePublicationNotScrape'] for x in d['items'])
          assert sum(d['countsByEvidenceTier'].values())==d['totalRows']
          print('PASS recent official',d['checkedOfficialRecentCandidates'],
                'historical and review rows',d['totalRows']-d['checkedOfficialRecentCandidates'],
                'source completeness',d['sourceCoverage'])
          PY
      - name: Publish official evidence queue atomically from latest remote main
        if: github.event_name != 'pull_request'
        run: |
          cp /tmp/reporting-evidence-queue.json digests/reporting_evidence_queue_latest.json
          python scripts/publish_newsroom_outputs.py --mode queue
