name: Problem Executive Check
# 문제 임원 점검 — 출입처 등기임원·미등기 사장급 한 사람씩 독립이사 법정 결격 가능(상법 시행령 제34조⑤ 7·3·1호)과 과거 논란 기사
# (네이버 뉴스 '이름+회사', 제목에 비위·사고·제재 낱말) — 11-05 기자 요청("임원에 대한 단독 — 문제 있는 임원").
# 매일 05:50 KST(Cloudflare 요청) + GitHub 예약 07:20 KST(대비용, 6시간 안 정시 요청 성공이면 건너뜀). 사람마다 기사 점검은 14일 간격.
# 코드가 바뀐 push는 저장하지 않고 요약만(이름·기사 제목 가림). 결과는 기자 전용 저장소(kr-exec-check)에만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_exec_check.py'
      - 'scripts/executive_article_evidence.py'
      - 'tests/test_kr_exec_check.py'
      - 'tests/test_executive_article_evidence.py'
      - '.github/workflows/kr-exec-check.yml'
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
    inputs:
      news_budget:
        description: '네이버 뉴스 검색 한도(비우면 250)'
        required: false
        default: ''
      refresh_news:
        description: 'true면 14일 간격과 상관없이 기사 다시 찾기(기준 바꾼 뒤)'
        required: false
        default: 'false'
      publish:
        description: 'true면 기자 전용 저장소 갱신, false면 요약만'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: kr-exec-check
  cancel-in-progress: false
jobs:
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: kr-exec-check.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::6시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Test tenure, directorship and news rules
        run: |
          python -m unittest discover -s tests -p 'test_kr_exec_check.py' -v
          python -m unittest discover -s tests -p 'test_executive_article_evidence.py' -v
      - name: Check beat executives (counts-only log)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BUDGET: ${{ github.event.inputs.news_budget }}
          REFRESH: ${{ github.event.inputs.refresh_news }}
          PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'false') }}
        run: |
          args=()
          [ -n "$BUDGET" ] && args+=(--news-budget "$BUDGET")
          [ "$REFRESH" = "true" ] && args+=(--refresh-news)
          if [ "$PUBLISH" = "true" ]; then
            python scripts/kr_exec_check.py "${args[@]}"
          else
            python scripts/kr_exec_check.py --annotate-only --news-budget 40 "${args[@]}"
          fi
