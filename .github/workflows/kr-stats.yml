name: KR Stats Watch
# 한국은행 ECOS 품목별 물가지수·KOSIS(철강협회 생산·광공업동향 품목)·KAIDA 수입 승용차 브랜드별 신규등록·미국 Census 한국산 수입액(품목 14개)·
# 현대차·기아 IR 모델별·해외 공장별 판매 엑셀(목록 3회 + 엑셀 8개, 바뀌지 않은 엑셀은 304로 다시 받지 않음). 평일 07:30 KST(Cloudflare 요청, GitHub 예약은 예비).
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만. 실행당 ECOS 약 23회·KOSIS 약 17회·Census 14회·KAIDA 2회(첫 실행 49회).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_stats_watch.py'
      - 'scripts/carsales.py'
      - 'tests/test_carsales.py'
      - 'data/kr_stats.json'
      - 'tests/test_kr_stats_watch.py'
      - '.github/workflows/kr-stats.yml'
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kr-stats-watch
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "openpyxl>=3.1,<4"
      - name: Test parsing
        run: python -m unittest tests.test_kr_stats_watch tests.test_carsales tests.test_private_store -v
      - name: Watch monthly statistics (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/kr_stats_watch.py
