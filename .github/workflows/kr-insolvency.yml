name: Supplier Insolvency Notices Watch
# 협력사 회생·파산: 대법원 회생·파산 공고(15개 법원 법인회생·법인파산)와 회생회사 M&A 공고에서 공장등록 업종이
# 철강·비철·자동차 부품·전기장비·화학인 제조사. 평일 07:20·17:20 KST(Cloudflare 요청이 정시 실행, GitHub 예약은 대비용).
# 결과는 기자 전용 저장소로만, 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_insolvency_watch.py'
      - 'tests/test_kr_insolvency_watch.py'
      - 'data/kr_supplier_watchlist.json'
      - '.github/workflows/kr-insolvency.yml'
  schedule:
    - cron: '20 22 * * 0-4'
    - cron: '20 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kr-insolvency-watch
  cancel-in-progress: false
jobs:
  insolvency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test notice parsing
        run: python -m unittest tests.test_kr_insolvency_watch tests.test_private_store -v
      - name: Watch insolvency notices (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/kr_insolvency_watch.py
