name: Scoop Radar Independent Refresh

on:
  push:
    branches: [main]
    paths:
      - 'pre_scoop_radar.py'
      - 'scripts/official_source_observation.py'
      - 'tests/test_official_source_observation.py'
      - 'scripts/official_publication_date_guard.py'
      - 'tests/test_official_publication_date_guard.py'
      - 'scoop_scout.py'
      - 'scripts/press_coverage_gate.py'
      - 'tests/test_scoop_press_coverage_failclosed.py'
      - 'digests/press_coverage_index_latest.json'
      - 'dart_numeric_extractor.py'
      - 'tests/test_official_collectors.py'
      - '.github/workflows/scoop-radar.yml'
      - 'data.json'
      - 'dart.json'
      - 'dart_numeric.json'
      - 'archive.json'
      - 'scoop.js'
      - 'index.html'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Both workflows write scoop.json and dart_numeric.json. Serialize writers.
  group: newsroom-radar-writers
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official collector parsers offline
        run: python -m unittest discover -s tests -p 'test_official_collectors.py' -v
      - name: Reject old source notices resurfaced as new RSS timestamps
        run: python -m unittest discover -s tests -p 'test_official_publication_date_guard.py' -v
      - name: Reject unanswerable press-office future strategy questions
        run: python -m unittest discover -s tests -p 'test_public_reporting_questions.py' -v
      - name: Reject failed press searches masquerading as no prior coverage
        run: python -m unittest discover -s tests -p 'test_scoop_press_coverage_failclosed.py' -v
      - name: Check issuer/counterparty DART group-transaction evidence
        run: python -m unittest discover -s tests -p 'test_dart_affiliate_scoop_gate.py' -v
      - name: Check every official source's health, baseline and post-gap classification
        run: python -m unittest discover -s tests -p 'test_official_source_observation.py' -v
      - name: Collect official-source and early signals
        run: python pre_scoop_radar.py
      - name: Extract numeric facts from DART originals
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_numeric_extractor.py
      - name: Screen scoop candidates and build lead diagnostics
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scoop_scout.py
      - name: Validate isolated radar outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pre=json.loads(Path('pre_scoop.json').read_text(encoding='utf-8'))
          scoop=json.loads(Path('scoop.json').read_text(encoding='utf-8'))
          numeric=json.loads(Path('dart_numeric.json').read_text(encoding='utf-8'))
          if not isinstance(numeric,dict) or not isinstance(numeric.get('items'),list):
              raise SystemExit('dart_numeric.json schema invalid')
          observed=pre.get('sourceObservations')
          if not isinstance(observed,dict) or observed.get('status')!='official_source_observation_not_exclusive':
              raise SystemExit('per-source retrieval state missing')
          if observed.get('confirmedScoops')!=0:
              raise SystemExit('source novelty may not assert a scoop')
          if not isinstance(pre,dict) or not isinstance(pre.get('items'),list):
              raise SystemExit('pre_scoop.json schema invalid')
          if not isinstance(scoop,dict) or not isinstance(scoop.get('items'),list):
              raise SystemExit('scoop.json schema invalid')
          if not isinstance(scoop.get('leadDiagnostics'),dict):
              raise SystemExit('leadDiagnostics missing')
          if not isinstance(scoop.get('dropStats'),dict):
              raise SystemExit('dropStats missing')
          if not isinstance(scoop.get('rssSearchDiagnostics'),dict):
              raise SystemExit('RSS search health missing: cannot assert no prior domestic coverage')
          if not isinstance(scoop.get('coverageSearchDiagnostics'),dict):
              raise SystemExit('Coverage search diagnostics missing')
          if not isinstance(scoop.get('pressIndexStatus'),str):
              raise SystemExit('Prior-press memory status missing')
          if any(x.get('domesticUnreportedProved') is True for x in scoop.get('items',[])):
              raise SystemExit('RSS and partial index cannot certify exclusive domestic reporting')
          if len(scoop['items'])>60:
              raise SystemExit('too many scoop candidates')
          from scoop_scout import DIRECT_BEAT_COMPANIES
          if scoop.get('beatScope') != 'direct-company-beats-only':
              raise SystemExit('scoop scope marker missing')
          for group in ('items', 'leadSignals', 'publicSignals'):
              for item in scoop.get(group,[]):
                  companies=item.get('companies') or []
                  if not companies or not set(companies).issubset(DIRECT_BEAT_COMPANIES):
                      raise SystemExit(f'out-of-beat {group}: {item.get("title")} / {companies}')
          print(
              'isolated scoop radar validated | '
              f"raw signals={len(pre['items'])} | "
              f"primary hits={scoop.get('counts',{}).get('primaryHits',0)} | "
              f"lead signals={scoop.get('leadSignalCount',0)} | "
              f"scoop candidates={len(scoop['items'])} | "
              f"lead diagnostics={scoop['leadDiagnostics']} | "
              f"drop stats={scoop['dropStats']}"
          )
          PY
      - name: Publish only validated isolated scoop radar outputs
        run: python scripts/publish_newsroom_outputs.py --mode scoop

  deploy:
    needs: scout
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest collected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate latest radar before deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('data.json','pre_scoop.json','scoop.json'):
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'{name} missing')
              json.loads(p.read_text(encoding='utf-8'))
          items=json.loads(Path('data.json').read_text(encoding='utf-8'))
          if not isinstance(items,list) or len(items)<10:
              raise SystemExit('latest newsroom feed invalid')
          scoop=json.loads(Path('scoop.json').read_text(encoding='utf-8'))
          print(f"deployment check: {len(items)} news items | {len(scoop.get('items',[]))} scoop candidates")
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh deployed DART diagnostics
        run: python dart_health.py
      - name: Stamp browser asset cache versions
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); v=os.environ['BUILD_SHA']
          for asset in ('data.js','app.js','pitch.js','dashboard.js','dashboard_v2.js','industry_priority.js','auto_exclusive.js','cross_media_gap.js','boss_followup.js','style.css','pitch.json','changes.json','strategic_shifts.json','dig_today.json','scoop.json'):
              s=re.sub(r'('+re.escape(asset)+r'\?v=)[^"\']+', r'\g<1>'+v, s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload latest site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy latest site
        id: deployment
        uses: actions/deploy-pages@v4
