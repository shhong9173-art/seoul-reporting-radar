name: Periodic Report Hidden Notes
# 출입처 분기·반기·사업보고서의 보고기간 후 사건·매각예정 주석, 제재 현황·중요한 소송·연결 범위 변동에서 새로 적힌 줄만(11-15 기자: 큰 단독).
# 평일 06:40·13:10·18:10·19:40, 토 09:40 KST(Cloudflare 요청) + GitHub 예약 20:40 KST(대비용, 6시간 안 정시 요청 성공이면 건너뜀).
# 코드가 바뀐 push는 저장하지 않고 건수만 남긴다. 결과는 기자 전용 저장소(kr-report-notes)에만 — 공개 JSON 없음, 공개 로그에는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/kr_report_notes.py'
      - 'tests/test_kr_report_notes.py'
      - '.github/workflows/kr-report-notes.yml'
  schedule:
    - cron: '40 11 * * 1-5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'true면 기자 전용 저장소 갱신, false면 건수만'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: kr-report-notes
  cancel-in-progress: false
jobs:
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: kr-report-notes.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::6시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  notes:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Test section reading and comparison
        run: python -m unittest discover -s tests -p 'test_kr_report_notes.py' -v
      - name: Compare report sections (counts-only log)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          PUBLISH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'false') }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/kr_report_notes.py
          else
            python scripts/kr_report_notes.py --dry-run --only 두산에너빌리티 한화솔루션 현대제철
          fi
