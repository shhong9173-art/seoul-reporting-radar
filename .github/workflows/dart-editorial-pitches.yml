name: DART Source-Change Reporter Pitches
on:
  push:
    branches: [main]
    paths:
      - 'scripts/dart_editorial_desk.py'
      - 'tests/test_dart_editorial_desk.py'
      - 'dart-pitches.html'
      - '.github/workflows/dart-editorial-pitches.yml'
  schedule:
    - cron: '15 0 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dart-editorial-pitches
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-source money-versus-quantity language
        run: |
          python -m compileall -q scripts/dart_editorial_desk.py
          python -m unittest discover -s tests -p 'test_dart_editorial_desk.py' -v
      - name: Create reporter-grade DART comparison briefing
        run: python scripts/dart_editorial_desk.py
      - name: Publish verified snapshot without replacing official originals
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/dart_editorial_desk_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh verified DART change pitch hypotheses [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
