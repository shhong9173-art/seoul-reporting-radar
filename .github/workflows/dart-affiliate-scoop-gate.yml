name: DART Affiliate Scoop Evidence Gate
on:
  pull_request:
    paths:
      - 'scripts/dart_affiliate_scoop_gate.py'
      - 'scripts/dart_specific_media.py'
      - 'scoop_scout.py'
      - 'scoop-sources.html'
      - 'tests/test_scoop_sources_view.cjs'
      - 'tests/test_dart_affiliate_scoop_gate.py'
      - 'tests/test_dart_specific_media.py'
      - 'scoop.js'
      - '.github/workflows/dart-affiliate-scoop-gate.yml'
      - '.github/workflows/scoop-radar.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dart_affiliate_scoop_gate.py'
      - 'scoop_scout.py'
      - '.github/workflows/dart-affiliate-scoop-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts/dart_affiliate_scoop_gate.py scripts/dart_specific_media.py scoop_scout.py
      - run: python -m unittest discover -s tests -p 'test_dart_affiliate_scoop_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_dart_specific_media.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_scoop_sources_view.cjs
      - name: Readable candidate coverage disclaimers
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const js=fs.readFileSync('scoop.js','utf8');
          assert(js.includes('미보도 확인 아님'));
          assert(js.includes('전문 미확인'));
          new Function(js);
          JS
