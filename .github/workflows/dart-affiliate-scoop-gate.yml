name: DART Affiliate Scoop Evidence Gate
on:
  pull_request:
    paths:
      - 'scripts/dart_affiliate_scoop_gate.py'
      - 'scoop_scout.py'
      - 'tests/test_dart_affiliate_scoop_gate.py'
      - '.github/workflows/dart-affiliate-scoop-gate.yml'
      - '.github/workflows/scoop-radar.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dart_affiliate_scoop_gate.py'
      - 'scoop_scout.py'
      - '.github/workflows/dart-affiliate-scoop-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts/dart_affiliate_scoop_gate.py scoop_scout.py
      - run: python -m unittest discover -s tests -p 'test_dart_affiliate_scoop_gate.py' -v
