name: Reporter Morning DART Digest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reporter-morning.yml'
  schedule:
    # Sunday-Thursday 21:50 UTC = Monday-Friday 06:50 KST.
    - cron: '50 21 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reporter-morning-digest
  cancel-in-progress: false
jobs:
  # GitHub 예약은 아침에 3시간쯤 늦게 온다(11-02: 06:50→10:03, 07:40→10:48, 08:10→11:28). 정시는 Cloudflare 워커가 요청하고,
  # 그 요청이 6시간 안에 성공했으면 늦게 온 예약 사본은 건너뛴다(요청이 실패했으면 예약이 대신 돈다).
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: reporter-morning.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::6시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  digest:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Run offline checks
        run: |
          python -m unittest discover -s tests -p 'test_reporter_kit.py' -v
          python -m unittest discover -s tests -p 'test_review_engine.py' -v
          python -m unittest discover -s tests -p 'test_dart_lineage.py' -v
          python scripts/dart_lineage.py --help > /dev/null
      - name: Collect official OpenDART filing lists
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/dart_watch.py --days 5
      - name: Verify original and amended DART documents independently
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_lineage.py --limit 3
      - name: Compare source evidence and check prior-news candidates
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/review_engine.py
      - name: Publish briefing
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ data/seen.txt
          if git diff --cached --quiet; then
            echo "No digest change"
          else
            git commit -m "chore: refresh morning briefing [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Cannot publish briefing after three attempts" >&2
            exit 1
          fi
