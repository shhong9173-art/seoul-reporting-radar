name: Industry Beat DART Official Disclosure Monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dart-beat-monitor.yml'
      - 'scripts/dart_beat_monitor.py'
      - 'scripts/dart_corp_registry.py'
      - 'tests/test_dart_beat_monitor.py'
      - 'dart-beat-monitor.html'
  schedule:
    # Weekdays 07:45 KST (= Sun-Thu 22:45 UTC)
    - cron: '45 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-overseas-contracts
  cancel-in-progress: false
jobs:
  official-beat-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official company identity, DART paging and true change classification
        run: |
          python -m compileall -q scripts/dart_beat_monitor.py scripts/dart_corp_registry.py
          python -m unittest discover -s tests -p 'test_dart_beat_monitor.py' -v
          node tests/test_dart_beat_monitor_view.cjs
      - name: Refresh missing corporation IDs from official DART corporate ZIP
        id: registry
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_corp_registry.py
      - name: List entire configured beat with bounded explicit source gaps
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_beat_monitor.py --detail-limit 12
      - name: Publish scope, first-seen history and exact-receipt change evidence
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digests/dart_beat_monitor_latest.json digests/dart_beat_changes_latest.json
          if test -f digests/dart_corp_code_coverage_latest.json; then git add digests/dart_corp_code_coverage_latest.json; fi
          git add dart_corp_codes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh industry beat DART coverage and event changes [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo 'DART beat data publish failed' >&2
          exit 1
