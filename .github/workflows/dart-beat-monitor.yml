name: Industry Beat DART Official Disclosure Monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dart-beat-monitor.yml'
      - 'scripts/dart_beat_monitor.py'
      - 'scripts/dart_beat_queue_sync.py'
      - 'scripts/official_event_triage.py'
      - 'scripts/official_beat_triage_merge.py'
      - 'tests/test_dart_beat_queue_sync.py'
      - 'tests/test_official_beat_triage_merge.py'
      - 'scripts/valueup_official_document.py'
      - 'scripts/share_cancellation_official_document.py'
      - 'scripts/business_cessation_official_document.py'
      - 'tests/test_business_cessation_official_document.py'
      - 'tests/test_share_cancellation_official_document.py'
      - 'tests/test_valueup_official_document.py'
      - 'scripts/valueup_first_party_crosscheck.py'
      - 'data/valueup_first_party_prior_evidence.json'
      - 'scripts/dart_corp_registry.py'
      - 'tests/test_dart_stock_identity.py'
      - 'scripts/publish_newsroom_outputs.py'
      - 'tests/test_publish_newsroom_outputs.py'
      - 'dart_collector.py'
      - 'dart_corp_codes.json'
      - 'scripts/dart_beat_run_health.py'
      - 'tests/test_dart_beat_run_health.py'
      - 'tests/test_dart_beat_monitor.py'
      - 'scripts/dart_beat_gate.py'
      - 'tests/test_dart_beat_gate.py'
      - 'tests/test_dart_cessation_overlap.py'
      - 'dart-beat-monitor.html'
  schedule:
    # Daily 07:45 and 17:45 Korea Standard Time, including weekends.
    # Public DART listing requests stay bounded by 48 firms and MAX_PAGES.
    - cron: '45 22 * * *'
    - cron: '45 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '직전 결과가 4시간 안이어도 다시 읽기'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: official-overseas-contracts
  cancel-in-progress: false
jobs:
  official-beat-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cloudflare 워커가 07:45·17:45 정시 요청, 10:45·20:45 재시도 칸. 직전 결과가 4시간 안이면(정시 칸 성공 뒤 재시도 칸·늦게 온 GitHub 예약) 건너뛴다.
      - name: Skip when the last published DART snapshot is fresh
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force && '1' || '' }}
        run: python scripts/dart_beat_gate.py >> "$GITHUB_OUTPUT"
      - name: Verify official company identity, DART paging and true change classification
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m compileall -q scripts/dart_beat_monitor.py scripts/dart_corp_registry.py scripts/share_cancellation_official_document.py
          python -m unittest discover -s tests -p 'test_dart_beat_monitor.py' -v
          python -m unittest discover -s tests -p 'test_dart_beat_gate.py' -v
          python -m unittest discover -s tests -p 'test_dart_cessation_overlap.py' -v
          python -m unittest discover -s tests -p 'test_dart_beat_queue_sync.py' -v
          python -m unittest discover -s tests -p 'test_official_beat_triage_merge.py' -v
          python -m unittest discover -s tests -p 'test_dart_stock_identity.py' -v
          python -m unittest discover -s tests -p 'test_valueup_first_party_crosscheck.py' -v
          python -m unittest discover -s tests -p 'test_valueup_official_document.py' -v
          python -m unittest discover -s tests -p 'test_share_cancellation_official_document.py' -v
          python -m unittest discover -s tests -p 'test_business_cessation_official_document.py' -v
          python -m unittest discover -s tests -p 'test_publish_newsroom_outputs.py' -v
          node tests/test_dart_beat_monitor_view.cjs
          python -m unittest discover -s tests -p 'test_dart_beat_run_health.py' -v
      - name: Refresh missing corporation IDs from official DART corporate ZIP
        id: registry
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_corp_registry.py
      - name: List entire configured beat with bounded explicit source gaps
        id: collect
        if: steps.gate.outputs.run == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_beat_monitor.py --detail-limit 12
      - name: Publish exact official registry, source receipts and changes atomically
        id: publish
        if: steps.gate.outputs.run == 'true'
        run: python scripts/publish_newsroom_outputs.py --mode dart_beat
      - name: Refresh reporting queue from newly published DART originals
        id: queue
        if: steps.publish.outcome == 'success'
        run: |
          # Reuse the exact official snapshot that was just published to main.
          # The independent atomic queue writer refuses source-date rollback.
          git fetch origin main
          git reset --hard origin/main
          python scripts/reporting_evidence_queue.py
          python scripts/publish_newsroom_outputs.py --mode queue
      - name: Refresh official event-date queue from the exact just-published DART source
        id: official_queue
        if: steps.queue.outcome == 'success'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Fetch the newest published DART snapshot before EVERY attempt.
          # Never rebase or push a stale event queue over a newer official run.
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/official_event_triage.py
            python scripts/official_beat_triage_merge.py
            python scripts/dart_beat_queue_sync.py --require-official-queue-sync
            git add digests/official_event_triage_latest.json
            if git diff --cached --quiet; then
              echo 'Already synchronized to latest official DART snapshot'
              exit 0
            fi
            git commit -m 'data: align official event-date queue to DART source [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo 'Official event-date queue sync failed: source state preserved' >&2
          exit 1
      - name: Record last execution health even when official API collection fails
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DART_TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DART_REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          DART_COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          DART_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DART_OFFICIAL_QUEUE_OUTCOME: ${{ steps.official_queue.outcome }}
        run: |
          set -e
          # Discard unpublished partial files or unpushed failed collector commits.
          # Health always describes the actual most-recent *published* main.
          git fetch origin main
          git reset --hard origin/main
          python scripts/dart_beat_run_health.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digests/dart_beat_run_health_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: record DART official source producer health [skip ci]'
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo 'Failed to publish DART run-health metadata' >&2
          exit 1

