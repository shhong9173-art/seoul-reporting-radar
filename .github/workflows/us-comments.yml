name: US Regulatory Comments Watch
# regulations.gov: 출입처 명의 의견서. 평일 08:20 KST. 결과는 기자 전용 저장소로만, 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/us_comments_watch.py'
      - 'scripts/private_store.py'
      - 'tests/test_us_comments_watch.py'
      - '.github/workflows/us-comments.yml'
  schedule:
    - cron: '20 23 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: us-comments-watch
  cancel-in-progress: false
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test comment filtering
        run: python -m unittest tests.test_us_comments_watch tests.test_private_store -v
      - name: Collect (counts-only log)
        env:
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/us_comments_watch.py
