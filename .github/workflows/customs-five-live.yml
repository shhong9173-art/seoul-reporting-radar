name: Customs Five Verification (Branch Only)
on:
  push:
    branches: [integration/customs-five-services-20261013]
    paths:
      - 'scripts/customs_five.py'
      - 'tests/test_customs_five.py'
      - '.github/workflows/customs-five-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Offline regression tests and syntax
        run: |
          python -m compileall -q scripts/customs_five.py
          python -m unittest discover -s tests -p 'test_customs_five.py' -v
      - name: Five real approved services, no publication
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          test -n "$CUSTOMS_API_KEY" || { echo "CUSTOMS_API_KEY missing"; exit 1; }
          python scripts/customs_five.py --output /tmp/customs_five_verified.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/customs_five_verified.json"))
          assert set(s["id"] for s in d["services"]) == {
              "regional","newtemper","newtemper_country","temper_country","kind"}
          assert all(s["rawRecordsCurrent"]>0 and s["rawRecordsPriorYear"]>0 for s in d["services"])
          assert all(s["status"]=="official_public_statistics_not_exclusive" for s in d["services"])
          print("CUSTOMS_FIVE_REAL_API_PASS", d["period"],
                [(s["id"], s["rawRecordsCurrent"], len(s["rows"])) for s in d["services"]])
          PY
