name: US State Environmental Notices Watch
# 미국 주 환경청 허가·공고 — 조지아 EPD 주간 공고 PDF, 앨라배마 ADEM 공고 목록, 루이지애나 LDEQ 공고에서 출입처 미국 공장 이름이 나온 것.
# 매일 07:05 KST(Cloudflare 요청, GitHub 예약은 대비용). 요청은 원천마다 몇 번(2초 간격), 본 PDF는 다시 받지 않는다.
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만(시설 이름·주소·서술은 찍지 않는다).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/us_state_env_watch.py'
      - 'tests/test_us_state_env_watch.py'
      - '.github/workflows/us-state-env.yml'
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: us-state-env-watch
  cancel-in-progress: false
jobs:
  state-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "pypdf>=4,<6"
      - name: Test notice parsing
        run: python -m unittest tests.test_us_state_env_watch tests.test_private_store -v
      - name: Watch state environmental notices (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/us_state_env_watch.py
