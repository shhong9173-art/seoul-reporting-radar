name: Seoul Reporting Radar Collector
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document readers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip pandas openpyxl
      - name: Collect public information
        run: python collector.py
      - name: Analyze attached documents
        run: python document_analyzer.py
      - name: Compare historical data
        run: python compare_engine.py
      - name: Link Seoul and district evidence
        run: python cross_source_engine.py
      - name: Build investigation graph
        run: python investigation_graph.py
      - name: Score story quality
        run: python story_quality.py
      - name: Commit radar data
        run: |
          git config user.name 'seoul-reporting-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m "chore: score reporting leads"
          git push
