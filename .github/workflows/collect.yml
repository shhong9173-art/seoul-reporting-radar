name: Seoul Reporting Radar Collector
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    # Run once for an intentional [deploy-radar] push; bot data commits do not retrigger collection.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[deploy-radar]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document readers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyhwp
      - name: Collect public information
        run: python -u collector.py
      - name: Analyze attached documents
        run: python -u document_analyzer.py
      - name: Compare historical data
        run: python -u compare_engine.py
      - name: Link Seoul and district evidence
        run: python -u cross_source_engine.py
      - name: Build investigation graph
        run: python -u investigation_graph.py
      - name: Score story quality
        run: python -u story_quality.py
      - name: Check media novelty
        run: python -u news_novelty.py
      - name: Advanced radar analysis
        run: python -u advanced_radar.py
      - name: Build browser data
        run: |
          python - <<'PY'
          import json
          raw=open('data.js',encoding='utf-8').read()
          if '=' not in raw:
              raise SystemExit('data.js has no assignment')
          items=json.loads(raw.split('=',1)[1].rstrip(' ;\n'))
          if not isinstance(items,list):
              raise SystemExit('data.js payload is not a list')
          if not items:
              raise SystemExit('collector produced zero radar items; refusing to deploy empty homepage')
          with open('data.json','w',encoding='utf-8') as f:
              json.dump(items,f,ensure_ascii=False,separators=(',',':'))
          print('browser data:',len(items),'items')
          PY
      - name: Commit radar data
        run: |
          git config user.name 'seoul-reporting-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.js data.json
          git diff --cached --quiet || git commit -m "chore: advanced reporting radar analysis"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
