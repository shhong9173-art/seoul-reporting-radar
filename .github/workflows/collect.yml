name: Seoul Reporting Radar Collector
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    # [deploy-radar] trigger a fresh collection after code changes.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[deploy-radar]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document readers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyhwp
      - name: Collect public information
        run: python -u collector.py
      - name: Analyze attached documents
        run: python -u document_analyzer.py
      - name: Compare historical data
        run: python -u compare_engine.py
      - name: Link Seoul and district evidence
        run: python -u cross_source_engine.py
      - name: Build investigation graph
        run: python -u investigation_graph.py
      - name: Score story quality
        run: python -u story_quality.py
      - name: Check media novelty
        run: python -u news_novelty.py
      - name: Advanced radar analysis
        run: python -u advanced_radar.py
      - name: Build browser data
        run: |
          python - <<'PY'
          import json,re,html
          raw=open('data.js',encoding='utf-8').read()
          if '=' not in raw: raise SystemExit('data.js has no assignment')
          items=json.loads(raw.split('=',1)[1].rstrip(' ;\n'))
          if not isinstance(items,list): raise SystemExit('data.js payload is not a list')

          NOISE_RE = re.compile(r'(layer_popup|@media|z-index|position\s*:|display\s*:|padding\s*:|margin\s*:|javascript:|mailto:|tel:|<\s*(div|style|script)|본문\s*바로가기|주메뉴\s*바로가기|사이트맵|로그인)', re.I)
          NAV_RE = re.compile(r'^(메뉴|검색|로그인|회원가입|사이트맵|바로가기|개인정보|주메뉴|본문|언어)$', re.I)

          def normalize_text(v):
              v = html.unescape(str(v or ''))
              v = re.sub(r'\s+', ' ', v).strip()
              return v

          def clean_title(t):
              t = normalize_text(t)
              if not t: return ''
              if NOISE_RE.search(t): return ''
              t = re.sub(r'\s*\.{2,}\s*', '… ', t)
              # Collapse obvious duplicated headline fragments.
              for n in range(min(120, len(t)//2), 29, -1):
                  left=t[:n].strip(' .…-')
                  if len(left)>=30 and left in t[n:]:
                      t=left
                      break
              return t[:180].strip(' .…-')

          def clean_summary(s,title):
              s = normalize_text(s)
              if not s: return '공식 공개자료입니다. 원문과 첨부자료를 확인한 뒤 과거자료·예산·계약·통계와 교차검증합니다.'
              if NOISE_RE.search(s) and sum(s.lower().count(x) for x in ['본문 바로가기','주메뉴 바로가기','로그인','사이트맵']) >= 2:
                  s = ''
              # Remove repeated exact title/lead fragments.
              if title and len(s) > 250:
                  lead=normalize_text(title)
                  if lead and s.lower().count(lead.lower()) > 1:
                      s=lead+' '+s.split(lead,1)[-1].strip()
              return (s or '공식 공개자료입니다. 원문과 첨부자료를 확인한 뒤 과거자료·예산·계약·통계와 교차검증합니다.')[:900]

          clean=[];seen=set()
          for x in items:
              title=clean_title(x.get('title',''))
              source=normalize_text(x.get('source',''))
              if not title or NAV_RE.match(title):
                  continue
              if not source or re.match(r'^(javascript:|mailto:|tel:)',source,re.I):
                  continue
              x['title']=title
              x['summary']=clean_summary(x.get('summary',''), title)
              x['source']=source
              x['detailUrl']=normalize_text(x.get('detailUrl') or source)
              # Keep a source/title/org identity key and remove exact duplicates.
              k=(x.get('org',''), title, source)
              if k in seen: continue
              seen.add(k); clean.append(x)

          # Sort for stable newsroom-facing output and cap the public dataset.
          clean.sort(key=lambda x:(int(x.get('score') or 0), x.get('date','')), reverse=True)
          items=clean[:400]
          if not items: raise SystemExit('no valid radar items remain after sanitization')
          with open('data.json','w',encoding='utf-8') as f: json.dump(items,f,ensure_ascii=False,separators=(',',':'))
          with open('data.js','w',encoding='utf-8') as f: f.write('const ITEMS = '+json.dumps(items,ensure_ascii=False,separators=(',',':'))+';\n')
          print('browser data:',len(items),'valid unique items')
          PY
      - name: Commit radar data
        run: |
          git config user.name 'seoul-reporting-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.js data.json
          git diff --cached --quiet || git commit -m "chore: publish radar data"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}

# [deploy-radar] force a fresh Pages deployment after UI and data-sanitization changes.
