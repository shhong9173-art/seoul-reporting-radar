name: Seoul Reporting Radar Collector
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public information
        run: python collector.py
      - name: Commit collected data
        run: |
          git config user.name 'seoul-reporting-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m "chore: refresh Seoul public information radar"
          git push
