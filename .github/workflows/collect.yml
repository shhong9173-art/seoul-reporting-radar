name: Seoul Reporting Radar Collector
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: seoul-reporting-radar-main
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[deploy-radar]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document readers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyhwp
      - name: Collect public information
        run: python -u collector.py
      - name: Analyze attached documents
        run: python -u document_analyzer.py
      - name: Compare historical data
        run: python -u compare_engine.py
      - name: Link Seoul and district evidence
        run: python -u cross_source_engine.py
      - name: Build investigation graph
        run: python -u investigation_graph.py
      - name: Score story quality
        run: python -u story_quality.py
      - name: Check media novelty
        run: python -u news_novelty.py
      - name: Advanced radar analysis
        run: python -u advanced_radar.py
      - name: Build browser data
        run: |
          python - <<'PY'
          import json,re,html
          raw=open('data.js',encoding='utf-8').read()
          if '=' not in raw: raise SystemExit('data.js has no assignment')
          items=json.loads(raw.split('=',1)[1].rstrip(' ;\n'))
          if not isinstance(items,list): raise SystemExit('data.js payload is not a list')

          NOISE_RE = re.compile(r'(layer_popup|@media|z-index|position\s*:|display\s*:|padding\s*:|margin\s*:|javascript:|mailto:|tel:|<\s*(div|style|script)|본문\s*바로가기|주메뉴\s*바로가기|사이트맵|로그인)', re.I)
          NAV_RE = re.compile(r'^(메뉴|검색|로그인|회원가입|사이트맵|바로가기|개인정보|주메뉴|본문|언어)$', re.I)

          def normalize(v):
              return re.sub(r'\s+', ' ', html.unescape(str(v or ''))).strip()

          clean=[];seen=set()
          for x in items:
              title=normalize(x.get('title'))
              source=normalize(x.get('source'))
              if not title or NAV_RE.match(title) or NOISE_RE.search(title):
                  continue
              if not source or re.match(r'^(javascript:|mailto:|tel:)',source,re.I):
                  continue
              x['title']=title[:180]
              summary=normalize(x.get('summary'))
              if NOISE_RE.search(summary) and sum(summary.lower().count(k) for k in ['본문 바로가기','주메뉴 바로가기','로그인','사이트맵'])>=2:
                  summary=''
              x['summary']=(summary or '공식 공개자료입니다. 원문·첨부자료를 확인하고 과거자료·예산·계약·통계와 교차검증합니다.')[:900]
              x['source']=source
              x['detailUrl']=normalize(x.get('detailUrl') or source)
              # S is hard-locked at the publish gate until an explicit, verified scoop proof exists.
              if x.get('level')=='S':
                  x['level']='A' if int(x.get('score') or 0)>=70 else 'B'
                  x['standaloneEligible']=False
              key=(x.get('org',''),x['title'],x['source'])
              if key in seen:continue
              seen.add(key);clean.append(x)

          clean.sort(key=lambda z:(int(z.get('score') or 0),z.get('date','')),reverse=True)
          items=clean[:400]
          if not items: raise SystemExit('no valid radar items remain after sanitization')
          bad=[x for x in items if NOISE_RE.search(x.get('title',''))]
          if bad: raise SystemExit(f'noise titles remain: {len(bad)}')
          s_count=sum(1 for x in items if x.get('level')=='S')
          if s_count: raise SystemExit(f'S-grade items remain at publish gate: {s_count}')
          print('browser data:',len(items),'valid unique items; S-grade:',s_count)
          with open('data.json','w',encoding='utf-8') as f: json.dump(items,f,ensure_ascii=False,separators=(',',':'))
          with open('data.js','w',encoding='utf-8') as f: f.write('const ITEMS = '+json.dumps(items,ensure_ascii=False,separators=(',',':'))+';\n')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
