name: Seoul Reporting Radar Collector
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install document readers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyhwp
      - name: Collect public information
        run: python -u collector.py
      - name: Analyze attached documents
        run: python -u document_analyzer.py
      - name: Compare historical data
        run: python -u compare_engine.py
      - name: Link Seoul and district evidence
        run: python -u cross_source_engine.py
      - name: Build investigation graph
        run: python -u investigation_graph.py
      - name: Score story quality
        run: python -u story_quality.py
      - name: Check media novelty
        run: python -u news_novelty.py
      - name: Advanced radar analysis
        run: python -u advanced_radar.py
      - name: Commit radar data
        run: |
          git config user.name 'seoul-reporting-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m "chore: advanced reporting radar analysis"
          git push
