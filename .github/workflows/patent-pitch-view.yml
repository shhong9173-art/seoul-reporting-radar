name: Patent Pitch Report View Tests
on:
  push:
    branches: [main]
    paths:
      - 'patent-pitches.html'
      - 'pitch-format.js'
      - 'patents.html'
      - 'index.html'
      - 'tests/test_patent_pitch_view.cjs'
      - '.github/workflows/patent-pitch-view.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify newspaper-format source safety, copy controls and HTML scripts
        run: node tests/test_patent_pitch_view.cjs
