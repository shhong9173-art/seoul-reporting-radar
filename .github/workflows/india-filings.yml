name: India Exchange Filings Watch
# 인도 상장 법인 공시 — NSE 공시 RSS(전 상장사 최신 약 1,400건)에서 현대차 인도법인(Hyundai Motor India Limited) 공시.
# 평일 13:10·16:10·19:10·22:10 KST + 화~토 03:10 KST(인도 자정 RSS 초기화 전)(Cloudflare 요청, GitHub 예약 :15는 대비용 — 늦게 오면 건너뜀). RSS 1번 + 새 A·B 공시의 첨부 PDF 몇 건(3초 간격).
# 결과는 기자 전용 저장소로만. 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/india_filings_watch.py'
      - 'tests/test_india_filings_watch.py'
      - '.github/workflows/india-filings.yml'
  schedule:
    - cron: '15 4,7,10,13 * * 1-5'
    - cron: '15 18 * * 1-5'   # 화~토 03:15 KST(인도 월~금 23:45) — RSS가 인도 자정에 새로 시작하기 전
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: india-filings-watch
  cancel-in-progress: false
jobs:
  india:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "pypdf>=4,<6"
      - name: Test filing parsing
        run: python -m unittest tests.test_india_filings_watch tests.test_private_store -v
      - name: Watch India exchange filings (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/india_filings_watch.py
