  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - run: python -m compileall -q scripts tests/test_reporter_kit.py tests/test_review_engine.py tests/test_dart_lineage.py tests/test_trade_trends.py tests/test_writer_lock.py tests/test_peer_financial.py tests/test_business_content.py tests/test_business_metric_compare.py tests/test_business_coverage.py tests/test_customs_integrity.py tests/test_customs_watch.py
      - run: python -m unittest discover -s tests -p 'test_reporter_kit.py' -v
      - run: python -m unittest discover -s tests -p 'test_review_engine.py' -v
      - run: python -m unittest discover -s tests -p 'test_dart_lineage.py' -v
      - run: python -m unittest discover -s tests -p 'test_trade_trends.py' -v
      - run: python -m unittest discover -s tests -p 'test_peer_financial.py' -v
      - run: python -m unittest discover -s tests -p 'test_business_content.py' -v
      - run: python -m unittest discover -s tests -p 'test_business_metric_compare.py' -v
      - run: python -m unittest discover -s tests -p 'test_business_coverage.py' -v
      - run: python -m unittest discover -s tests -p 'test_recent_business_scout.py' -v
      - run: python -m unittest discover -s tests -p 'test_case_metrics_regression.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_foreign_contracts.py' -v
      - run: python -m unittest discover -s tests -p 'test_investigation_hunt.py' -v
      - run: python -m unittest discover -s tests -p 'test_patent_hunt.py' -v
      - run: python -m unittest discover -s tests -p 'test_patent_deep_hunt.py' -v
      - run: python -m unittest discover -s tests -p 'test_patent_claim_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_customs_integrity.py' -v
      - run: python -m unittest discover -s tests -p 'test_customs_watch.py' -v
      - run: python -m unittest discover -s tests -p 'test_business_metric_compare.py' -v
      - run: python -m unittest discover -s tests -p 'test_writer_lock.py' -v
      - name: Private watches and season tools (screening, overseas, earnings, governance)
        run: python -m unittest tests.test_scoop_screen tests.test_naver_api tests.test_private_store tests.test_us_comments_watch tests.test_page_watch tests.test_partner_watch tests.test_earnings_compare tests.test_governance_watch tests.test_trade_remedy_watch tests.test_ktc_watch tests.test_us_litigation_watch tests.test_kr_official_watch tests.test_kr_signals_watch tests.test_kr_stats_watch tests.test_trademark_watch tests.test_assembly_watch tests.test_kipris_account_ledger tests.test_dart_filing_facts -v
      - run: python -m unittest discover -s tests -p 'test_official_collectors.py' -v
      - run: node tests/test_dart_health_ui.cjs
      - run: node tests/test_morning_view.cjs
      - run: node tests/test_data_lab.cjs
      - run: node tests/test_business_content_view.cjs
      - run: node tests/test_business_metric_view.cjs
      - run: node tests/test_business_news_view.cjs
      - run: node tests/test_hs_trade_view.cjs
      - run: node tests/test_latest_interim_view.cjs
      - run: node tests/test_official_watch.cjs
      - run: node tests/test_hunt_view.cjs
      - run: node tests/test_patent_hunt_view.cjs
      - run: node tests/test_patent_deep_view.cjs
      - run: node tests/test_patent_claim_view.cjs
