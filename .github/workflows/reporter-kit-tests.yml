name: Reporter Kit Regression Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'reporter_kit/**'
      - 'watchlist.txt'
      - 'morning.html'
      - 'tests/test_reporter_kit.py'
      - 'tests/test_review_engine.py'
      - '.github/workflows/reporter-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'reporter_kit/**'
      - 'watchlist.txt'
      - 'morning.html'
      - 'tests/test_reporter_kit.py'
      - 'tests/test_review_engine.py'
      - '.github/workflows/reporter-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - run: python -m compileall -q scripts tests/test_reporter_kit.py tests/test_review_engine.py
      - run: python -m unittest discover -s tests -p 'test_reporter_kit.py' -v
      - run: python -m unittest discover -s tests -p 'test_review_engine.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_collectors.py' -v
      - run: node tests/test_dart_health_ui.cjs
