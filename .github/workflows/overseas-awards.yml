name: Overseas Award Notices Watch
# 해외 발주처 낙찰 공고(EU TED 낙찰자 칸·영국 Find a Tender·세계은행 낙찰 공고·바레인 월간 낙찰 보고서)에서 출입처가 낙찰자로 적힌 것.
# 평일 06:50·17:30 KST(Cloudflare 요청이 정시 실행, GitHub 예약은 대비용). 결과는 기자 전용 저장소로만, 공개 로그는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/overseas_award_watch.py'
      - 'tests/test_overseas_award_watch.py'
      - '.github/workflows/overseas-awards.yml'
  schedule:
    - cron: '50 21 * * 0-4'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overseas-awards-watch
  cancel-in-progress: false
jobs:
  awards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3" "pypdf>=4,<6"
      # 바레인 월간 낙찰 보고서가 스캔 이미지 PDF일 때 글자 인식(OCR). 설치가 안 되면 스크립트가 '스캔 — 미확인'으로 남긴다.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null || echo "::warning title=ocr-tools::글자 인식 도구 설치 실패 — 스캔 보고서는 미확인"
      - name: Test award parsing
        run: python -m unittest tests.test_overseas_award_watch tests.test_private_store -v
      - name: Watch overseas award notices (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python scripts/overseas_award_watch.py
