name: EU Official Journal Trade Defence (Korea)
# EU 관보 반덤핑·상계관세·세이프가드 규정·공고(유럽연합 출판청 목록·본문) — 한국산 출입 업종 품목과, 본문에 출입처(해외 법인 포함)가 수출자로 나온
# 확정·잠정 관세(11-19 기자 "다음발전해": 11-13 냉연 규정의 포스코 베트남을 파이낸셜뉴스가 11-17에 썼다). 매일 17:50·21:10·07:00 KST(Cloudflare 요청)
# + GitHub 예약 22:20 KST(대비용). 결과는 기자 전용 저장소(eu-trade-defence)에만 — 공개 로그에는 건수만.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/eu_trade_defence_watch.py'
      - 'tests/test_eu_trade_defence_watch.py'
      - '.github/workflows/eu-trade-defence.yml'
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'true면 기자 전용 저장소 갱신, false면 건수만'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: eu-trade-defence
  cancel-in-progress: false
jobs:
  late-cron-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WF: eu-trade-defence.yml
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice title=late-cron::3시간 안 정시 요청 실행이 성공 — 늦게 온 GitHub 예약은 건너뜀"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
  notices:
    needs: late-cron-gate
    if: needs.late-cron-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Test regulation reading
        run: python -m unittest discover -s tests -p 'test_eu_trade_defence_watch.py' -v
      - name: Read EU Official Journal (counts-only log)
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish != 'false' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/eu_trade_defence_watch.py
          else
            python scripts/eu_trade_defence_watch.py --dry-run
          fi
