name: Official HS Trade Trends
on:
  push:
    branches: [main]
    paths:
      - 'scripts/customs.py'
      - 'scripts/customs_watch.py'
      - '.github/workflows/hs-trends.yml'
  schedule:
    # Monday 07:55 Asia/Seoul = Sunday 22:55 UTC
    - cron: '55 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: hs-official-trends
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install customs official API client
        run: python -m pip install "requests>=2.31,<3"
      - name: Validate HS extractor without API
        run: |
          python -m compileall -q scripts/customs.py scripts/customs_watch.py scripts/trade_trends.py
          python -m unittest discover -s tests -p 'test_customs_integrity.py' -v
          python -m unittest discover -s tests -p 'test_customs_watch.py' -v
      - name: Retrieve broad HS category monthly values if configured
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python scripts/customs_watch.py
      - name: Publish only fully validated monthly comparison
        run: |
          set -e
          if [ ! -f digests/hs_trends_latest.json ]; then
            echo "CUSTOMS_API_KEY not configured or no verified output; no invented dataset"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/hs_trends_latest.json
          if git diff --cached --quiet; then
            echo "HS official evidence unchanged"
          else
            git commit -m "data: update customs HS trends [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Failed to publish verified HS stats" >&2
            exit 1
          fi
