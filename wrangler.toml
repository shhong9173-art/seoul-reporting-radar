name = "seoul-reporting-radar"
main = "worker.js"
compatibility_date = "2026-08-19"

[assets]
directory = "."
binding = "ASSETS"

# Cloudflare Cron schedules are UTC.
# 08:00 KST = 23:00 UTC (previous day)
# 12:00 KST = 03:00 UTC
# 18:00 KST = 09:00 UTC
[triggers]
crons = ["0 23 * * *", "0 3 * * *", "0 9 * * *"]
